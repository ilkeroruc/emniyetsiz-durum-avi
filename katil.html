<html lang="tr">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Risk Avı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{--paper:#fff;--canvas:#eef1f5;--ink:#10233f;--muted:#5e6b7d;--rule:#d5dce6;--soft:#f5f7fa;--blue:#0b3e91;--blue-d:#082e6c;--red:#e1251b;--green:#1f7a3a;
  --head:"Barlow Semi Condensed","Arial Narrow",sans-serif;--body:"Source Sans 3",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--body);font-size:17px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.strip{display:flex;height:5px;padding-top:env(safe-area-inset-top);background:var(--paper)}
.strip i{flex:1}
.strip i:nth-child(1){background:#f9d71c}.strip i:nth-child(2){background:#f28a1e}.strip i:nth-child(3){background:#e2231a}.strip i:nth-child(4){background:#7b2d8e}
.strip i:nth-child(5){background:#4a5da8}.strip i:nth-child(6){background:#00aeef}.strip i:nth-child(7){background:#6cbe45}.strip i:nth-child(8){background:#f9d71c}
button{font:inherit;cursor:pointer;border:1px solid var(--blue);border-radius:6px;padding:15px 20px;font-family:var(--head);font-weight:700;font-size:21px;background:var(--blue);color:#fff;width:100%}
button:active{background:var(--blue-d)}
button:disabled{opacity:.45}
input{font:inherit;font-size:18px;width:100%;background:var(--paper);border:1px solid var(--rule);color:var(--ink);border-radius:6px;padding:13px 14px}
input:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
input:disabled{background:var(--soft);color:var(--muted)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar img{height:26px;display:block}
.bar .vr{width:1px;height:22px;background:var(--rule)}
.bar .t{font-family:var(--head);font-weight:700;font-size:21px;color:var(--blue)}
.bar .me{margin-left:auto;font-size:14px;color:var(--muted);max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipband{background:var(--tc);color:var(--ty);padding:22px 16px 14px;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;animation:band .6s cubic-bezier(.2,1.2,.4,1)}
@keyframes band{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
.chipband small{font-size:14px;opacity:.85}
.chipband b{font-family:var(--head);font-size:48px;font-weight:700;line-height:1;letter-spacing:-.5px}
.wrap{flex:1;padding:18px 16px;padding-bottom:max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%;margin:0 auto}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px}
.center{text-align:center;align-items:center}
h2{font-family:var(--head);font-size:28px;font-weight:700;line-height:1.1}
h3{font-family:var(--head);font-size:20px;font-weight:700}
p{color:var(--muted);line-height:1.5}
p b{color:var(--ink)}
.ic{width:52px;height:52px;border-radius:50%;background:#e8eef8;color:var(--blue);display:flex;align-items:center;justify-content:center}
.ic svg{width:28px;height:28px}
.ic.warn{background:#fdecea;color:var(--red)}
.wait{display:flex;gap:6px}
.wait span{width:22px;height:6px;border-radius:1px;animation:w 1.4s infinite}
.wait span:nth-child(1){background:#f9d71c}.wait span:nth-child(2){background:#e2231a;animation-delay:.15s}.wait span:nth-child(3){background:#00aeef;animation-delay:.3s}.wait span:nth-child(4){background:#6cbe45;animation-delay:.45s}
@keyframes w{0%,100%{opacity:.25}50%{opacity:1}}
.timer{position:sticky;top:0;z-index:5;background:var(--canvas);padding:6px 0 8px}
.timer .row{display:flex;align-items:baseline;justify-content:space-between}
.timer .row span:first-child{font-weight:600}
.timer .sec{font-family:var(--head);font-size:46px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;line-height:1}
.timer .sec.low{color:var(--red)}
.prog{height:5px;background:#dfe5ee;border-radius:3px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--blue);transition:width .2s linear}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:flex;gap:10px;align-items:center}
.line .n{width:26px;text-align:right;font-family:var(--head);font-weight:700;font-size:18px;color:var(--muted);flex-shrink:0}
.add{background:var(--paper);color:var(--blue);font-size:18px;padding:12px}
.saved{font-size:14px;color:var(--muted);text-align:right;min-height:17px}
.mine{list-style:none;display:flex;flex-direction:column}
.mine li{padding:10px 2px;border-bottom:1px solid var(--rule);font-weight:600}
.mine li:last-child{border-bottom:0}
.scores{display:flex;flex-direction:column}
.sc{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--rule);font-weight:600}
.sc:last-child{border-bottom:0}
.sc .dot{width:12px;height:22px;border-radius:2px;background:var(--tc)}
.sc .v{margin-left:auto;font-family:var(--head);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.sc.on{font-weight:700}
.sc.on .nm{color:var(--tk)}
.win{background:var(--paper);border:1px solid var(--rule);border-radius:8px;overflow:hidden;text-align:center;animation:band .7s cubic-bezier(.2,1.2,.4,1)}
.win .sw{height:96px;background:var(--tc)}
.win .bd{padding:16px 18px 20px;display:flex;flex-direction:column;gap:4px;align-items:center}
.win .lab{color:var(--muted);font-weight:600}
.win h2{font-size:40px;color:var(--tk)}
.win .pt{font-family:var(--head);font-size:22px;font-weight:600}
.win .cg{margin-top:8px;font-weight:700;color:var(--green)}
.err{color:var(--red);font-size:15px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:10px}
</style>
</head>

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ls(k, v){ try{ if(v === undefined) return localStorage.getItem(k); if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){ return null; } }

const qs = new URLSearchParams(location.search);
const KOD = (qs.get("o") || "").trim();
let sb = null;
async function q(p){ const { data, error } = await p; if(error) throw error; return data; }
const api = {
  getSession: k => q(sb.from("egitim_oturum").select("*").eq("kod", k).maybeSingle()),
  getKat: id => q(sb.from("egitim_katilimci").select("*").eq("id", id).maybeSingle()),
  listTeams: k => q(sb.from("egitim_katilimci").select("id,takim").eq("oturum", k)),
  addKat: row => q(sb.from("egitim_katilimci").insert(row).select().single()),
  updKat: (id, p) => q(sb.from("egitim_katilimci").update(p).eq("id", id))
};

const P = { o: null, me: null, screen: null, items: [], dirty: false, saveT: null, locked: false, err: null, seq: 0, lastSaved: null };

/* ---------- Veri ---------- */
async function refresh(){
  if(!sb) return;
  const seq = P.seq;
  try{
    const o = await api.getSession(KOD);
    let me = P.me;
    if(P.me){ me = await api.getKat(P.me.id); }
    if(seq !== P.seq) return;
    P.o = o;
    if(P.me && !me){ ls("eo_me_" + KOD, null); } // yönetici çıkardı
    P.me = me;
    P.err = o ? null : "nosession";
    // puan ekranlarında sadece kurada kullanılan takımları göster
    if(o && ["degerlendirme", "esitlik", "sonuc"].includes(o.durum) && (!P.usedAt || Date.now() - P.usedAt > 10000)){
      P.usedAt = Date.now();
      api.listTeams(KOD).then(rows => { P.used = new Set(rows.map(r => r.takim).filter(Boolean)); const sc = $("scores"); if(sc) sc.innerHTML = scoresHtml(true); }).catch(() => {});
    }
    render();
  }catch(e){ console.warn(e); }
}

async function join(){
  const ad = $("ad").value.trim().replace(/\s+/g, " ");
  if(ad.length < 2) { $("joinErr").textContent = "Lütfen adınızı ve soyadınızı yazın."; return; }
  $("joinBtn").disabled = true;
  try{
    let takim = null;
    if(P.o && P.o.durum !== "lobi"){
      // kuradan sonra katıldıysa en az kişili takıma ekle
      const rows = await api.listTeams(KOD);
      const c = {}; TEAMS.forEach(t => c[t.id] = 0); rows.forEach(r => { if(c[r.takim] != null) c[r.takim]++; });
      const used = TEAMS.filter(t => c[t.id] > 0);
      takim = (used.length ? used : TEAMS).slice().sort((a, b) => c[a.id] - c[b.id])[0].id;
    }
    P.seq++;
    P.me = await api.addKat({ oturum: KOD, ad: ad.slice(0, 60), takim });
    ls("eo_me_" + KOD, P.me.id);
    render();
  }catch(e){
    $("joinBtn").disabled = false;
    $("joinErr").textContent = "Katılım başarısız: " + (e.message || e);
  }
}

/* ---------- Kaydetme ---------- */
function cleanItems(){ return P.items.map(s => s.trim()).filter(Boolean); }
function scheduleSave(){
  P.dirty = true;
  clearTimeout(P.saveT);
  P.saveT = setTimeout(flush, 600);
  const s = $("savedLbl"); if(s) s.textContent = "kaydediliyor…";
}
async function flush(){
  clearTimeout(P.saveT);
  if(!P.dirty || !P.me) return;
  P.dirty = false;
  const list = cleanItems();
  try{
    await api.updKat(P.me.id, { maddeler: list });
    P.lastSaved = list.length;
    const s = $("savedLbl"); if(s) s.textContent = "✓ " + list.length + " madde gönderildi";
  }catch(e){
    P.dirty = true;
    const s = $("savedLbl"); if(s) s.textContent = "Bağlantı sorunu, tekrar deneniyor…";
    P.saveT = setTimeout(flush, 1500);
  }
}

/* ---------- Görünüm ---------- */
function screenName(){
  if(!KOD) return "nolink";
  if(!sb) return "nocfg";
  if(!P.o) return P.err ? "nosession" : "loading";
  if(!P.me) return "join";
  const d = P.o.durum;
  if(d === "lobi") return "lobi";
  if(!P.me.takim) return "lobi";
  return d; // takimlar | yazma | degerlendirme | sonuc
}

function renderHead(){
  const h = $("head");
  const t = P.me && P.me.takim && P.o && P.o.durum !== "lobi" ? T[P.me.takim] : null;
  const sig = (t ? t.id : "") + "|" + (P.me ? P.me.ad : "");
  if(h.dataset.sig === sig) return; h.dataset.sig = sig;
  h.innerHTML = `<div class="bar"><img src="${LOGO}" alt="Nippon Paint BETEK"><span class="vr"></span><span class="t">Risk Avı</span>${P.me && !t ? `<span class="me">${esc(P.me.ad)}</span>` : ""}</div>`
    + (t ? `<div class="chipband" style="${tv(t)}"><small>${esc(P.me.ad)}</small><b class="tn">${t.ad} takımı</b></div>` : "");
}

function render(){
  renderHead();
  const scr = screenName();
  const main = $("main");
  if(scr !== P.screen){
    const prev = P.screen; P.screen = scr;
    if(prev === "yazma") { P.locked = true; flush(); }
    if(scr === "yazma"){
      P.items = ((P.me && P.me.maddeler) || []).slice(); // sayfa yenilenirse yazılanlar geri gelsin
      while(P.items.length < 3 || P.items[P.items.length - 1] !== "") P.items.push("");
      P.locked = false; P.lastSaved = null;
    }
    main.innerHTML = skeleton(scr);
    if(scr === "join"){ const i = $("ad"); i.value = ls("eo_ad") || ""; i.addEventListener("keydown", e => { if(e.key === "Enter") join(); }); }
    if(scr === "yazma"){ renderLines(); const f = main.querySelector("input"); if(f) setTimeout(() => f.focus(), 100); }
  }
  update(scr);
}

function skeleton(scr){
  switch(scr){
    case "nolink": return `<div class="card center">${icon("link","warn")}<h2>Bağlantı eksik</h2><p>Eğitim ekranındaki QR kodu tekrar okutun.</p></div>`;
    case "nocfg": return `<div class="card center">${icon("alert","warn")}<h2>Bağlantı kurulamadı</h2><p>Sunucu ayarı eksik. Eğitmene bildirin.</p></div>`;
    case "loading": return `<div class="card center"><div class="wait"><span></span><span></span><span></span><span></span></div><p>Bağlanıyor</p></div>`;
    case "nosession": return `<div class="card center">${icon("clock","warn")}<h2>Oturum bulunamadı</h2><p>Bu oturum kapanmış olabilir. Ekrandaki güncel QR kodu okutun.</p></div>`;
    case "join": return `<div class="card"><h2>Hoş geldiniz</h2><p>Lobiye katılmak için adınızı ve soyadınızı yazın.</p>
      <input id="ad" placeholder="Ad Soyad" autocomplete="name" maxlength="60" enterkeyhint="go">
      <div class="err" id="joinErr"></div>
      <button id="joinBtn" onclick="join()">Lobiye katıl</button></div>`;
    case "lobi": return `<div class="card center">${icon("check")}<h2>Lobidesiniz</h2>
      <p>Eğitmen kurayı başlattığında takımınız bu ekranda görünecek.</p><div class="wait"><span></span><span></span><span></span><span></span></div></div>`;
    case "takimlar": return `<div class="card">${icon("eye")}<h2 id="tkTitle"></h2>
      <p>Birazdan ekranda bir görsel açılacak. <b>Görselde gördüğünüz tüm riskleri</b> süre bitmeden madde madde yazın.</p>
      <p>Her geçerli madde takımınıza 1 puan kazandırır.</p></div>`;
    case "yazma": return `<div class="timer"><div class="row"><span>Gördüğün riskler</span><span class="sec" id="sec">--</span></div><div class="prog"><i id="prog"></i></div></div>
      <div class="lines" id="lines"></div>
      <button class="add" id="addBtn" onclick="addLine()">+ Madde ekle</button>
      <div class="saved" id="savedLbl"></div>`;
    case "degerlendirme": return `<div class="card">${icon("clock")}<h2>Süre doldu</h2><p id="revInfo"></p></div>
      <div class="card"><h3>Puan durumu</h3><div class="scores" id="scores"></div></div>
      <div class="card"><h3>Yazdıklarınız</h3><ul class="mine" id="mine"></ul></div>`;
    case "esitlik": return `<div class="card">${icon("scale")}<h2>Eşitlik var</h2><p id="tieInfo"></p></div>
      <div class="card"><h3>Puan durumu</h3><div class="scores" id="scores"></div></div>`;
    case "sonuc": return `<div id="res"></div>`;
    default: return "";
  }
}

function update(scr){
  if(scr === "takimlar"){ const t = T[P.me.takim]; const el = $("tkTitle"); el.textContent = t.ad + " takımındasınız"; el.style.color = t.koyu; }
  else if(scr === "yazma") tick();
  else if(scr === "degerlendirme"){
    const a = P.o.aktif_takim && T[P.o.aktif_takim];
    $("revInfo").innerHTML = a ? `Şu an <b style="color:${a.koyu}">${a.ad}</b> takımının maddeleri değerlendiriliyor.` : "Maddeler değerlendiriliyor.";
    $("scores").innerHTML = scoresHtml();
    const mine = (P.me.maddeler || []);
    $("mine").innerHTML = mine.length ? mine.map(x => `<li>${esc(x)}</li>`).join("") : `<li style="color:var(--muted)">Madde yazılmadı.</li>`;
  }
  else if(scr === "esitlik"){
    const tied = rank().filter((x, i, r) => x.pts === r[0].pts), a = P.o.aktif_takim && T[P.o.aktif_takim];
    $("tieInfo").innerHTML = `<b>${tied.map(x => x.t.ad).join(" ve ")}</b> takımları berabere. Onaylanan riskler potansiyel şiddetine göre 1 ile 3 arasında puanlanıyor.` + (a ? ` Şu an <b style="color:${a.koyu}">${a.ad}</b> takımı değerlendiriliyor.` : "");
    $("scores").innerHTML = scoresHtml(true);
  }
  else if(scr === "sonuc") renderResult();
}

function scoresHtml(sorted){
  const p = P.o.puanlar || {};
  const tb = p._esitlik || {};
  const pool = TEAMS.filter(t => p[t.id] != null || (P.used ? P.used.has(t.id) : true));
  const list = sorted ? pool.slice().sort((a, b) => ((p[b.id] || 0) - (p[a.id] || 0)) || ((tb[b.id] == null ? -1 : tb[b.id]) - (tb[a.id] == null ? -1 : tb[a.id]))) : pool;
  return list.map(t => `<div class="sc ${P.me.takim === t.id ? "on" : ""}" style="${tv(t)}"><span class="dot"></span><span class="nm">${t.ad}${P.me.takim === t.id ? " (siz)" : ""}</span><span class="v">${p[t.id] != null ? p[t.id] : "–"}${tb[t.id] != null ? ` <small style="color:var(--muted);font-size:13px;font-family:var(--body);font-weight:400">+${tb[t.id]} pot.</small>` : ""}</span></div>`).join("");
}

function rank(){
  const p = P.o.puanlar || {}, tb = p._esitlik || {};
  return TEAMS.filter(t => p[t.id] != null).map(t => ({ t, pts: p[t.id], tb: tb[t.id] }))
    .sort((a, b) => (b.pts - a.pts) || ((b.tb == null ? -1 : b.tb) - (a.tb == null ? -1 : a.tb)));
}
function renderResult(){
  const el = $("res"), p = P.o.puanlar || {};
  const sig = JSON.stringify(p) + P.me.takim; if(el.dataset.sig === sig) return; el.dataset.sig = sig;
  const r = rank(), top = r.length ? r[0].pts : 0;
  let tied = r.filter(x => x.pts === top);
  const tbDone = tied.length > 1 && tied.every(x => x.tb != null);
  if(tbDone){ const best = Math.max.apply(null, tied.map(x => x.tb)); tied = tied.filter(x => x.tb === best); }
  const winners = tied.map(x => x.t);
  const iWon = winners.some(t => t.id === P.me.takim);
  const w0 = winners[0] || TEAMS[0];
  el.innerHTML = `<div class="win" style="${tv(w0)}"><div class="sw"></div><div class="bd">
      <span class="lab">${winners.length > 1 ? "Berabere kalan takımlar" : "Kazanan takım"}</span>
      <h2>${winners.map(w => w.ad).join(" ve ")} takımı</h2>
      <span class="pt">${top} puan${tbDone ? `, ${tied[0].tb} potansiyel puan` : ""}</span>
      ${iWon ? `<span class="cg">Tebrikler, kazandınız!</span>` : ""}</div></div>
    <div class="card"><h3>Sıralama</h3><div class="scores">${scoresHtml(true)}</div></div>`;
}

/* ---------- Yazma ---------- */
function renderLines(){
  const el = $("lines"); if(!el) return;
  el.innerHTML = P.items.map((v, i) => `<div class="line"><span class="n">${i + 1}.</span><input data-i="${i}" value="${esc(v)}" placeholder="Gördüğün risk" maxlength="200" enterkeyhint="next" ${P.locked ? "disabled" : ""}></div>`).join("");
}
function addLine(focus){
  if(P.locked) return;
  P.items.push("");
  const el = $("lines"), i = P.items.length - 1;
  const d = document.createElement("div"); d.className = "line";
  d.innerHTML = `<span class="n">${i + 1}.</span><input data-i="${i}" placeholder="Gördüğün risk" maxlength="200" enterkeyhint="next">`;
  el.appendChild(d);
  if(focus !== false) d.querySelector("input").focus();
}
document.addEventListener("input", e => {
  if(e.target.dataset && e.target.dataset.i != null && !P.locked){
    const i = +e.target.dataset.i; P.items[i] = e.target.value;
    if(i === P.items.length - 1 && e.target.value.trim()) addLine(false);
    scheduleSave();
  }
});
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.dataset && e.target.dataset.i != null){
    e.preventDefault();
    const next = document.querySelector(`input[data-i="${+e.target.dataset.i + 1}"]`);
    if(next) next.focus(); else addLine();
  }
});
document.addEventListener("focusout", e => { if(e.target.dataset && e.target.dataset.i != null && P.dirty) flush(); });

function tick(){
  if(P.screen !== "yazma") return;
  const end = P.o.bitis ? new Date(P.o.bitis).getTime() : 0;
  const ms = end - Date.now(), total = (P.o.sure || 30) * 1000;
  const sec = Math.max(0, Math.ceil(ms / 1000));
  const s = $("sec"); s.textContent = sec; s.classList.toggle("low", sec <= 5);
  $("prog").style.width = Math.max(0, Math.min(100, ms / total * 100)) + "%";
  if(ms <= 0 && !P.locked){
    P.locked = true;
    document.querySelectorAll("#lines input").forEach(i => { i.disabled = true; i.blur(); });
    $("addBtn").disabled = true;
    P.dirty = true; flush();
    $("savedLbl").textContent = "Süre doldu — gönderiliyor…";
  } else if(ms > 0 && P.locked){
    // süre uzatıldı
    P.locked = false;
    document.querySelectorAll("#lines input").forEach(i => i.disabled = false);
    $("addBtn").disabled = false;
  }
}
setInterval(tick, 200);

/* ---------- Başlat ---------- */
async function boot(){
  $("foot").textContent = "BETEK SEÇ · " + VERSION;
  const c = { url: qs.get("u") || DEFAULT_SUPABASE_URL, key: qs.get("k") || DEFAULT_SUPABASE_KEY };
  if(KOD && c.url && c.key && window.supabase) sb = window.supabase.createClient(c.url, c.key);
  render();
  if(!sb) return;
  try{
    P.o = await api.getSession(KOD);
    if(!P.o){ P.err = "nosession"; P.o = null; render(); return; }
    const id = ls("eo_me_" + KOD);
    if(id){ P.me = await api.getKat(id); if(!P.me) ls("eo_me_" + KOD, null); }
  }catch(e){ P.err = e; }
  render();
  try{
    sb.channel("eo_" + KOD).on("postgres_changes", { event: "UPDATE", schema: "public", table: "egitim_oturum", filter: "kod=eq." + KOD }, () => refresh()).subscribe();
  }catch(e){ console.warn(e); }
  setInterval(refresh, 2000);
}
window.addEventListener("pagehide", () => { if(P.dirty) flush(); });
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") refresh(); else if(P.dirty) flush(); });
document.addEventListener("input", e => { if(e.target.id === "ad") ls("eo_ad", e.target.value); });
boot();
</script>
</body>
</html>
