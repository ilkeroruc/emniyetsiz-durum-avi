<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Risk Avı · Yönetici</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --paper:#ffffff; --canvas:#eef1f5; --ink:#10233f; --muted:#5e6b7d; --rule:#d5dce6; --soft:#f5f7fa;
  --blue:#0b3e91; --blue-d:#082e6c; --red:#e1251b; --green:#1f7a3a; --green-bg:#e8f4ec; --amber:#b86e00;
  --head:"Barlow Semi Condensed", "Arial Narrow", sans-serif; --body:"Source Sans 3", system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--body);font-size:17px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* BETEK renk şeridi (logodaki çubuklardan) */
.strip{display:flex;height:6px}
.strip i{flex:1}
.strip i:nth-child(1){background:#f9d71c}.strip i:nth-child(2){background:#f28a1e}.strip i:nth-child(3){background:#e2231a}.strip i:nth-child(4){background:#7b2d8e}
.strip i:nth-child(5){background:#4a5da8}.strip i:nth-child(6){background:#00aeef}.strip i:nth-child(7){background:#6cbe45}.strip i:nth-child(8){background:#f9d71c}

button{font:inherit;cursor:pointer;border:1px solid var(--rule);border-radius:6px;padding:11px 18px;font-weight:600;background:var(--paper);color:var(--ink);transition:background .15s,border-color .15s}
button:hover:not(:disabled){border-color:var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}
.btn-main{background:var(--blue);border-color:var(--blue);color:#fff;font-family:var(--head);font-weight:700;font-size:21px;padding:13px 30px;letter-spacing:.2px}
.btn-main:hover:not(:disabled){background:var(--blue-d);border-color:var(--blue-d)}
.btn-ghost{color:var(--ink)}
.btn-danger{color:var(--red);border-color:#f0b8b4}
.btn-danger:hover:not(:disabled){border-color:var(--red)}
input,select{font:inherit;background:var(--paper);border:1px solid var(--rule);color:var(--ink);border-radius:6px;padding:10px 12px}

.app{min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:18px;padding:12px 28px;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .logo{height:38px;display:block}
.top .vr{width:1px;height:30px;background:var(--rule)}
.brand{font-family:var(--head);font-weight:700;font-size:26px;color:var(--blue);letter-spacing:-.2px}
.meta{color:var(--muted);font-size:15px}
.meta b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.top .sp{flex:1}
.ver{font-size:12px;color:var(--muted)}
.stage{flex:1;padding:24px 28px;display:flex;flex-direction:column;gap:20px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(140px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:6px;font-weight:600;transition:transform .25s;z-index:99;max-width:90vw}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}

/* Kurulum */
.setup{max-width:680px;margin:36px auto;width:100%;display:flex;flex-direction:column;gap:18px}
.setup .hero-logo{height:64px;align-self:flex-start}
.setup h1{font-family:var(--head);font-size:64px;font-weight:700;line-height:1;color:var(--blue);letter-spacing:-1px}
.setup .lead{color:var(--muted);font-size:19px;line-height:1.45;max-width:58ch}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:14px}
.card h3{font-family:var(--head);font-size:21px;font-weight:700;display:flex;align-items:center;gap:10px}
.card h3 .n{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-size:16px;display:inline-flex;align-items:center;justify-content:center}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:160px}
.field label{font-size:14px;color:var(--muted);font-weight:600}
.imgbox{display:flex;gap:16px;align-items:center}
.imgbox .thumb{width:168px;height:104px;border-radius:6px;background:var(--soft) center/cover no-repeat;border:1px dashed var(--rule);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;flex-shrink:0}
.filebtn{position:relative;overflow:hidden;display:inline-block}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* Lobi */
.lobby{display:grid;grid-template-columns:minmax(360px,440px) 1fr;gap:24px;flex:1}
.qrcard{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:16px;align-self:start}
.qrcard h2{font-family:var(--head);font-size:30px;font-weight:700;text-align:center;line-height:1.1}
#qr{width:340px;height:340px;display:flex;align-items:center;justify-content:center;padding:10px;border:1px solid var(--rule);border-radius:6px}
#qr img,#qr canvas{width:318px!important;height:318px!important}
.qrcard .link{font-size:13px;color:var(--muted);word-break:break-all;text-align:center}
.qrcard .kod{font-size:15px;color:var(--muted)}
.qrcard .kod b{font-family:var(--head);font-size:30px;color:var(--ink);letter-spacing:4px;margin-left:6px}
.people{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:26px;display:flex;flex-direction:column;gap:20px}
.count{font-size:20px;color:var(--muted)}
.count b{font-family:var(--head);font-size:84px;color:var(--blue);font-weight:700;margin-right:12px;line-height:.9;vertical-align:-10px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.chip{background:var(--soft);border:1px solid var(--rule);border-radius:4px;padding:8px 6px 8px 14px;font-weight:600;font-size:18px;display:flex;align-items:center;gap:4px}
.chip .x{border:0;background:none;padding:0 8px;color:var(--muted);font-size:20px;line-height:1}
.chip .x:hover{color:var(--red)}
.empty{color:var(--muted);font-size:18px;padding:28px 0}
.bar{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.bar .hint{color:var(--muted);margin-right:auto;font-size:16px}

/* Takımlar: boya kartelası çipi */
.teams{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;align-items:start;align-content:start}
.team{background:var(--paper);border:1px solid var(--rule);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.team .swatch{height:92px;background:var(--tc)}
.team .th{padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule)}
.team .th b{font-family:var(--head);font-size:30px;font-weight:700;color:var(--tk);line-height:1}
.team .th small{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.team ul{list-style:none;padding:8px 10px 12px;display:flex;flex-direction:column}
.team li{padding:8px 6px;font-weight:600;font-size:18px;border-bottom:1px solid var(--soft)}
.team li:last-child{border-bottom:0}
.teams.many .team .swatch{height:44px}
.teams.many .team .th b{font-size:24px}
.teams.many .team li{padding:5px 6px;font-size:17px}
.kura .team li{animation:drop .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.kura-now{text-align:center;font-family:var(--head);font-size:64px;font-weight:700;min-height:76px;line-height:76px;color:var(--tk,var(--ink))}

/* Yazma */
.write{display:grid;grid-template-columns:1fr 330px;gap:20px;flex:1;min-height:0}
.imgstage{background:#1d2633;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:60vh;position:relative;cursor:zoom-in}
.imgstage img{max-width:100%;max-height:calc(100vh - 150px);object-fit:contain;display:block}
.imgstage .noimg{color:#aab5c4;font-size:18px;padding:40px;text-align:center;line-height:1.5}
.side{display:flex;flex-direction:column;gap:14px}
.timer{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:22px;text-align:center}
.timer .big{font-family:var(--head);font-size:132px;font-weight:700;line-height:.9;color:var(--blue);font-variant-numeric:tabular-nums}
.timer .big.low{color:var(--red)}
.timer .lbl{color:var(--muted);margin-top:8px}
.prog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:16px}
.prog i{display:block;height:100%;background:var(--blue);transition:width .2s linear}
.tstats{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--rule);border-radius:8px}
.tstat{display:flex;align-items:center;gap:12px;padding:12px 16px;font-weight:700;border-bottom:1px solid var(--rule)}
.tstat:last-of-type{border-bottom:0}
.dot{width:14px;height:22px;border-radius:2px;flex-shrink:0;background:var(--tc)}
.tstat .n{margin-left:auto;font-family:var(--head);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.tstat small{color:var(--muted);font-weight:400}
.tnote{color:var(--muted);font-size:13px;padding:0 4px;text-align:right}

/* Değerlendirme */
.review{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;flex:1;min-height:0}
.review .imgstage{min-height:auto;position:sticky;top:20px;align-self:start;height:calc(100vh - 130px)}
.review .imgstage img{max-height:100%}
.rpanel{display:flex;flex-direction:column;gap:14px;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tab{padding:0;border-radius:6px;overflow:hidden;text-align:left;display:flex;flex-direction:column;border:1px solid var(--rule);background:var(--paper)}
.tab::before{content:"";display:block;height:14px;background:var(--tc);transition:height .2s}
.tab b{font-family:var(--head);font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;color:var(--tk);padding:7px 10px 0}
.tab .sc{font-size:13px;color:var(--muted);padding:0 10px 8px;font-weight:600}
.tab.on{border-color:var(--tk);box-shadow:inset 0 0 0 1px var(--tk)}
.tab.on::before{height:26px}
.tab.done .sc{color:var(--green)}
.rbox{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.rhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:4px}
.rhead h2{font-family:var(--head);font-size:36px;font-weight:700;line-height:1;color:var(--tk)}
.rhead .mem{color:var(--muted);font-size:15px}
.items{position:relative;scroll-behavior:smooth;display:flex;flex-direction:column;overflow:auto;max-height:calc(100vh - 430px);border-top:1px solid var(--rule)}
.item{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 10px;border-bottom:1px solid var(--rule);border-left:4px solid transparent}
.item .no{color:var(--muted);font-family:var(--head);font-weight:700;font-size:18px;width:28px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.item .tx{flex:1;font-size:20px;font-weight:600;line-height:1.3;word-break:break-word}
.item .who{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:2px}
.item .dup{font-size:12px;background:#fff1cc;color:#7a5200;padding:1px 7px;border-radius:3px;margin-left:8px;font-weight:700;vertical-align:2px}
.item.cur{background:#f0f5fd;border-left-color:var(--blue)}
.item.ok{border-left-color:var(--green);background:var(--green-bg)}
.item.ok.cur{box-shadow:inset 0 0 0 2px var(--blue)}
.item.no-ok .tx{text-decoration:line-through;color:var(--muted)}
.item.no-ok{background:var(--soft)}
.mk{width:44px;height:44px;padding:0;font-size:21px;font-weight:700;flex-shrink:0;color:var(--muted)}
.mk.y.on{background:var(--green);border-color:var(--green);color:#fff}
.mk.n.on{background:var(--red);border-color:var(--red);color:#fff}
.pot{width:44px;height:44px;padding:0;font-family:var(--head);font-size:22px;font-weight:700;flex-shrink:0;color:var(--muted)}
.pot.on[data-v="1"]{background:#f6c445;border-color:#f6c445;color:var(--ink)}
.pot.on[data-v="2"]{background:#ec8a2b;border-color:#ec8a2b;color:#fff}
.pot.on[data-v="3"]{background:var(--red);border-color:var(--red);color:#fff}
.item.potset{border-left-color:#ec8a2b}
.scorebar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:4px}
.scorebar .acc{color:var(--muted)}
.scorebar .acc b{color:var(--ink);font-family:var(--head);font-size:24px;font-variant-numeric:tabular-nums}
.scorebar input{width:110px;font-family:var(--head);font-size:32px;font-weight:700;text-align:center;padding:6px}
.scorebar .sp{flex:1}
.tiebanner{background:#fff7e3;border:1px solid #f1d28a;border-left:4px solid #e3a514;border-radius:6px;padding:12px 16px;font-weight:700;font-size:18px;color:#5b3d00}
.tiebanner small{display:block;font-weight:400;font-size:15px;color:#6f5520;margin-top:3px}

/* Sonuç */
.result{flex:1;display:flex;flex-direction:column;align-items:center;gap:26px;padding-top:8px}
.crown{font-family:var(--head);font-size:30px;font-weight:600;color:var(--muted)}
.winner{background:var(--paper);border:1px solid var(--rule);border-radius:8px;overflow:hidden;text-align:center;max-width:1100px;width:100%;animation:win .9s cubic-bezier(.2,1.25,.4,1)}
@keyframes win{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.winner::before{content:"";display:block;height:120px;background:var(--tc)}
.winner .tn{font-family:var(--head);font-size:96px;font-weight:700;line-height:1;color:var(--tk);margin-top:22px;letter-spacing:-1px}
.winner .ts{font-family:var(--head);font-size:30px;font-weight:600;margin-top:6px;color:var(--ink);font-variant-numeric:tabular-nums}
.winner .names{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:22px 28px 30px}
.winner .names span{background:var(--soft);border:1px solid var(--rule);padding:8px 14px;border-radius:4px;font-weight:600;font-size:20px}
.ranks{display:flex;gap:0;flex-wrap:wrap;justify-content:center;background:var(--paper);border:1px solid var(--rule);border-radius:8px}
.rank{padding:14px 22px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px;border-right:1px solid var(--rule)}
.rank:last-child{border-right:0}
.ranks.many{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:1300px}
.ranks.many .rank{border-bottom:1px solid var(--rule);justify-content:flex-start}
.ranks.many .rank:nth-child(5n){border-right:0}
.ranks.many .rank:nth-last-child(-n+5):nth-child(5n+1),.ranks.many .rank:nth-last-child(-n+5):nth-child(5n+1)~.rank{border-bottom:0}
.ranks.many .rank .pts{margin-left:auto}
.rank .pos{color:var(--muted);font-family:var(--head)}
.rank .pts{font-family:var(--head);font-size:30px;font-variant-numeric:tabular-nums}
.rank small{color:var(--muted);font-weight:400;font-size:14px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

.lightbox{position:fixed;inset:0;background:rgba(10,18,32,.95);z-index:80;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox img{max-width:98vw;max-height:98vh}
.modal{position:fixed;inset:0;background:rgba(16,35,63,.45);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{max-width:560px;width:100%}
[hidden]{display:none!important}
@media (max-width:1100px){.lobby,.write,.review{grid-template-columns:1fr}.teams,.tabs{grid-template-columns:repeat(3,1fr)}.review .imgstage{position:static;height:50vh}.items{max-height:none}}
</style>
</head>
<body>
<div class="strip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox" hidden><img alt=""></div>
<div class="confetti" id="confetti"></div>

<script>
/* ================= AYARLAR ================= */
const VERSION = "v3.2";
// Supabase proje bilgileri (BETEK Cup projesi). Anon key'i buraya yapıştırırsanız hiçbir cihazda elle girmeye gerek kalmaz.
const DEFAULT_SUPABASE_URL = "https://arjecfiigkebkeccfpxi.supabase.co";
const DEFAULT_SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyamVjZmlpZ2tlYmtlY2NmcHhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NDg5NzEsImV4cCI6MjEwNTEyNDk3MX0.YhcLALmCr8IQjTuBZTkJKSjIW8TlXpT6oOzPcgAc2k8";

];
const T = Object.fromEntries(TEAMS.map(t => [t.id, t]));
const tv = t => `--tc:${t.renk};--tk:${t.koyu}`;

function ls(k, v){ try{ if(v === undefined) return localStorage.getItem(k); if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){ return null; } }
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const norm = s => String(s||"").toLocaleLowerCase("tr").replace(/[^\p{L}\p{N}]+/gu," ").trim();

function toast(msg, err){ const t = $("toast"); t.textContent = msg; t.className = "toast on" + (err ? " err" : ""); clearTimeout(toast._t); toast._t = setTimeout(() => t.className = "toast", err ? 5000 : 2200); }
function showErr(e){ console.error(e); toast("Hata: " + (e && (e.message || e.details) || e), true); }

/* ---------- Supabase ---------- */
let sb = null;
function getCfg(){ const p = new URLSearchParams(location.search); return { url: p.get("u") || ls("eo_url") || DEFAULT_SUPABASE_URL, key: p.get("k") || ls("eo_key") || DEFAULT_SUPABASE_KEY }; }
function initSb(){ const c = getCfg(); if(!c.url || !c.key || !window.supabase) return false; sb = window.supabase.createClient(c.url, c.key); return true; }
async function q(p){ const { data, error } = await p; if(error) throw error; return data; }
const api = {
  getSession: k => q(sb.from("egitim_oturum").select("*").eq("kod", k).maybeSingle()),
  createSession: (k, sure) => q(sb.from("egitim_oturum").insert({ kod:k, durum:"lobi", sure, puanlar:{} })),
  updSession: (k, p) => q(sb.from("egitim_oturum").update(p).eq("kod", k)),
  listKat: k => q(sb.from("egitim_katilimci").select("*").eq("oturum", k).order("created_at", { ascending:true })),
  upsertKat: rows => q(sb.from("egitim_katilimci").upsert(rows)),
  updKat: (id, p) => q(sb.from("egitim_katilimci").update(p).eq("id", id)),
  delKat: id => q(sb.from("egitim_katilimci").delete().eq("id", id)),
  clearMaddeler: k => q(sb.from("egitim_katilimci").update({ maddeler: [] }).eq("oturum", k))
};

  drawing: null,        // kura animasyonu durumu
  sel: null,            // değerlendirmede seçili takım

try{ S.marks = JSON.parse(ls("eo_marks_" + S.kod) || "{}"); }catch(e){ S.marks = {}; }

function saveMarks(){ ls("eo_marks_" + S.kod, JSON.stringify(S.marks)); ls("eo_pot_" + S.kod, JSON.stringify(S.pot)); }
function teamMembers(tid){ return S.kat.filter(k => k.takim === tid); }
function activeTeams(){ return TEAMS.filter(t => teamMembers(t.id).length > 0); }
function joinUrl(){
  const base = location.href.split("?")[0].split("#")[0].replace(/[^\/]*$/, "") + KATIL_SAYFASI;
  let u = base + "?o=" + encodeURIComponent(S.kod);
  const c = getCfg();
  if(c.url !== DEFAULT_SUPABASE_URL) u += "&u=" + encodeURIComponent(c.url);
  if(c.key !== DEFAULT_SUPABASE_KEY) u += "&k=" + encodeURIComponent(c.key);
  return u;
}

async function setSession(patch){
  S.seq++;
  S.o = Object.assign({}, S.o, patch);
  render();
  try{ await api.updSession(S.kod, patch); }catch(e){ showErr(e); }
  S.seq++;
}

async function refresh(){
  if(!sb || !S.kod) return;
  const seq = S.seq;
  try{
    const [o, k] = await Promise.all([api.getSession(S.kod), api.listKat(S.kod)]);
    if(seq !== S.seq) return; // arada yazma oldu, eski veriyi uygulama
    if(!o){ S.kod = null; ls("eo_kod", null); S.o = null; render(); return; }
    S.o = o; S.kat = k || [];
    render();
  }catch(e){ console.warn(e); }
}

/* ---------- Görsel ---------- */
function loadImage(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1920, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img, 0, 0, c.width, c.height);
      S.gorsel = c.toDataURL("image/jpeg", 0.88);
      ls("eo_gorsel", S.gorsel);
      S.screen = null; render(); toast("Görsel yüklendi");
    };
    img.onerror = () => toast("Görsel okunamadı", true);
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

}

function afterSkeleton(scr){

function update(scr){
  if(scr === "lobi") updLobby();
  else if(scr === "takimlar") updTeams();
  else if(scr === "yazma") updWrite();
  else if(scr === "degerlendirme") updReview();
  else if(scr === "esitlik") updTie();
  else if(scr === "sonuc") updResult();
}

/* --- Lobi --- */
function updLobby(){
  $("cnt").textContent = S.kat.length;
  const sig = S.kat.map(k => k.id + k.ad).join("|");
  const pl = $("plist");
  if(pl.dataset.sig !== sig){
    pl.dataset.sig = sig;
    pl.innerHTML = S.kat.length ? S.kat.map(k => `<span class="chip">${esc(k.ad)}<button class="x" title="Çıkar" data-act="kick" data-id="${k.id}">×</button></span>`).join("")
      : `<div class="empty">Henüz kimse yok. QR kodu okutmalarını bekleyin…</div>`;
  }
  $("drawBtn").disabled = S.kat.length < 1;
  const n = S.kat.length, sz = plannedSizes(n);
  $("drawHint").textContent = n ? `${sz.length} takım: ${sz.join("-")} kişi` + (n > TEAMS.length * S.maxKisi ? `. ${TEAMS.length * S.maxKisi} kişiyi aştığı için bazı takımlar ${S.maxKisi} kişiden kalabalık olacak.` : "") : "";
}

/* --- Kura --- */
// Takım sayısı: her takım en fazla S.maxKisi kişi olacak şekilde, en az 1 en çok 10 takım
function teamCount(n){ return Math.max(1, Math.min(TEAMS.length, Math.ceil(n / S.maxKisi))); }
function plannedSizes(n){ const k = teamCount(n), base = Math.floor(n / k), extra = n % k; return Array.from({ length: k }, (_, i) => base + (i < extra ? 1 : 0)); }
function gridCols(k){ return k <= 5 ? k : Math.ceil(k / 2); }
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function balancedAssign(people){
  // Renkler sabit sırayla kullanılır (önce Fuşya…Manolya, sonra BETEK paleti); fazla kişinin hangi takımlara düşeceği rastgele
  const order = shuffle(TEAMS.slice(0, teamCount(people.length)).map(t => t.id));
  return shuffle(people).map((p, i) => ({ p, takim: order[i % order.length] }));
}
async function doDraw(){
  if(!S.kat.length) return;
  const plan = balancedAssign(S.kat);
  try{
    await api.upsertKat(plan.map(x => ({ id: x.p.id, oturum: S.kod, ad: x.p.ad, takim: x.takim })));
  }catch(e){ return showErr(e); }
  plan.forEach(x => x.p.takim = x.takim);
  S.drawing = { plan, i: 0, teams: TEAMS.filter(t => plan.some(x => x.takim === t.id)) };
  render();
  const step = Math.max(160, Math.min(450, 9000 / plan.length));
  await new Promise(res => {
    const tick = () => {
      if(!S.drawing) return res();
      const d = S.drawing;
      if(d.i >= d.plan.length) return res();
      const x = d.plan[d.i++], t = T[x.takim];
      const now = $("kuraNow"); now.textContent = x.p.ad; now.style.setProperty("--tk", t.koyu);
      const li = document.createElement("li"); li.textContent = x.p.ad; $("kl_" + x.takim).appendChild(li);
      const c = $("kc_" + x.takim); c.textContent = +c.textContent + 1;
      setTimeout(tick, step);
    };
    setTimeout(tick, 600);
  });
  await new Promise(r => setTimeout(r, 900));
  S.drawing = null;
  S.marks = {}; S.pot = {}; S.edited = {}; saveMarks();
  await setSession({ durum: "takimlar", puanlar: {}, aktif_takim: null, bitis: null });
}

/* --- Takımlar --- */
function teamsGridHtml(){
  return activeTeams().map(t => { const m = teamMembers(t.id);
    return `<div class="team" style="${tv(t)}"><div class="swatch"></div><div class="th"><b>${t.ad}</b><small>${m.length} kişi</small></div><ul>${m.map(k => `<li>${esc(k.ad)}</li>`).join("")}</ul></div>`; }).join("");
}
function updTeams(){
  const sig = S.kat.map(k => k.id + k.takim).join("|");
  const el = $("teams");
  if(el.dataset.sig !== sig){
    el.dataset.sig = sig; el.innerHTML = teamsGridHtml();
    const k = activeTeams().length; el.style.gridTemplateColumns = `repeat(${gridCols(k)},1fr)`; el.classList.toggle("many", k > 5);
  }
  const big = activeTeams().filter(t => teamMembers(t.id).length > S.maxKisi);
  const hint = $("teamHint");
  if(hint) hint.textContent = big.length ? `Dikkat: ${big.map(t => t.ad).join(", ")} takımı ${S.maxKisi} kişiyi geçti (geç katılım). Hediye sınırı için kurayı yeniden çekebilirsiniz.` : "Katılımcılar kendi ekranlarında takımlarını görüyor. Hazır olduğunuzda yazma turunu başlatın.";
  $("startBtn").textContent = `Yazma turunu başlat (${S.o.sure || S.sure} sn)`;
}

async function startWrite(){
  // takımsız kalan (geç katılan) varsa en küçük takıma ata
  const loose = S.kat.filter(k => !k.takim || !T[k.takim]);
  if(loose.length){
    const rows = [];
    loose.forEach(k => {
      const pool = activeTeams().length ? activeTeams() : TEAMS.slice(0, 1);
      const t = pool.slice().sort((a, b) => teamMembers(a.id).length - teamMembers(b.id).length)[0].id;
      k.takim = t; rows.push({ id: k.id, oturum: S.kod, ad: k.ad, takim: t });
    });
    try{ await api.upsertKat(rows); }catch(e){ return showErr(e); }
  }
  try{ await api.clearMaddeler(S.kod); }catch(e){ return showErr(e); }
  S.kat.forEach(k => k.maddeler = []);
  S.marks = {}; S.pot = {}; S.edited = {}; saveMarks(); S.ending = false;
  const sure = S.o.sure || S.sure;
  await setSession({ durum: "yazma", bitis: new Date(Date.now() + (sure + 1) * 1000).toISOString(), puanlar: {}, aktif_takim: null });
}

/* --- Yazma --- */
function remainingMs(){ return S.o && S.o.bitis ? new Date(S.o.bitis).getTime() - Date.now() : 0; }
function updWrite(){
  const sig = S.kat.map(k => k.id + ":" + (k.maddeler || []).length + k.takim).join("|");
  const el = $("tstats");
  if(el.dataset.sig !== sig){
    el.dataset.sig = sig;
    el.innerHTML = activeTeams().map(t => { const m = teamMembers(t.id); const n = m.reduce((a, k) => a + (k.maddeler || []).length, 0);
      return `<div class="tstat" style="${tv(t)}"><span class="dot"></span>${t.ad}<small>${m.length} kişi</small><span class="n">${n}</span></div>`; }).join("")
      + `<div class="tnote">Takımların yazdığı madde sayısı, canlı</div>`;
  }
  tickWrite();
}
function tickWrite(){
  if(S.screen !== "yazma") return;
  const ms = remainingMs(), sure = (S.o.sure || S.sure) * 1000;
  const sec = Math.max(0, Math.ceil(ms / 1000));
  const big = $("tBig"); big.textContent = sec; big.classList.toggle("low", sec <= 5 && sec > 0);
  $("tProg").style.width = Math.max(0, Math.min(100, ms / sure * 100)) + "%";
  $("tLbl").textContent = sec > 0 ? "saniye kaldı" : "Süre doldu — cevaplar toplanıyor…";
  if(ms <= 0 && !S.ending){
    S.ending = true;
    setTimeout(async () => {
      if(S.o.durum !== "yazma") return;
      await refresh();
      const first = activeTeams()[0];
      S.sel = first ? first.id : null;
      await setSession({ durum: "degerlendirme", aktif_takim: S.sel });
    }, 2500);
  }
}
setInterval(tickWrite, 200);

/* --- Değerlendirme --- */
function teamItems(tid){
  const out = [];
  teamMembers(tid).forEach(k => (k.maddeler || []).forEach((tx, i) => { if(String(tx).trim()) out.push({ key: k.id + ":" + i, tx: String(tx).trim(), ad: k.ad }); }));
  const seen = {};
  out.forEach(x => { const n = norm(x.tx); x.dup = !!seen[n]; seen[n] = true; });
  return out;
}
function acceptedCount(tid){ return teamItems(tid).filter(x => S.marks[x.key] === "y").length; }
function updReview(){
  const teams = activeTeams();
  if(!S.sel || !teamMembers(S.sel).length) S.sel = S.o.aktif_takim && teamMembers(S.o.aktif_takim).length ? S.o.aktif_takim : (teams[0] && teams[0].id);
  const p = S.o.puanlar || {};
  const tabs = $("tabs");
  const tsig = S.sel + JSON.stringify(p) + teams.map(t => t.id).join();
  if(tabs.dataset.sig !== tsig){
    tabs.dataset.sig = tsig;
    tabs.style.gridTemplateColumns = `repeat(${gridCols(teams.length)},1fr)`;
    tabs.innerHTML = teams.map(t => { const has = teamMembers(t.id).length;
      return `<button class="tab ${t.id === S.sel ? "on" : ""} ${p[t.id] != null ? "done" : ""}" style="${tv(t)}" data-act="seltab" data-t="${t.id}" ${has ? "" : "disabled"}><b>${t.ad}</b><span class="sc">${p[t.id] != null ? p[t.id] + " puan" : (has ? "Puanlanmadı" : "Boş")}</span></button>`; }).join("");
  }
  renderRbox();
  const done = teams.every(t => p[t.id] != null);
  $("resBtn").disabled = !done;
  $("resHint").textContent = done ? "Tüm takımlar puanlandı." : `${teams.filter(t => p[t.id] != null).length}/${teams.length} takım puanlandı`;
}
function renderRbox(){
  const box = $("rbox"); if(!box || !S.sel) return;
  const t = T[S.sel], items = teamItems(S.sel), mem = teamMembers(S.sel);
  const sig = rboxSig(items);
  if(box.dataset.sig === sig) return;
  const oldList = box.querySelector(".items");
  const keepScroll = box.dataset.team === S.sel && oldList ? oldList.scrollTop : 0;
  const keepCur = box.dataset.team === S.sel ? S.cur : null;
  box.dataset.sig = sig; box.dataset.team = S.sel;
  const acc = items.filter(x => S.marks[x.key] === "y").length;
  const saved = (S.o.puanlar || {})[S.sel];
  const val = S.edited[S.sel] != null ? S.edited[S.sel] : (acc || saved || 0);
  box.innerHTML = `<div class="rhead" style="${tv(t)}"><h2>${t.ad} takımı</h2><span class="mem">${mem.map(k => esc(k.ad)).join(", ")}</span></div>
    <div class="items">${items.length ? items.map((x, i) => { const m = S.marks[x.key];
      return `<div class="item ${m === "y" ? "ok" : m === "n" ? "no-ok" : ""}" data-key="${x.key}"><span class="no">${i + 1}.</span>
        <div class="tx">${esc(x.tx)}${x.dup ? `<span class="dup">TEKRAR</span>` : ""}<span class="who">${esc(x.ad)}</span></div>
        <button class="mk y ${m === "y" ? "on" : ""}" data-act="mark" data-k="${x.key}" data-v="y" title="Geçerli">✓</button>
        <button class="mk n ${m === "n" ? "on" : ""}" data-act="mark" data-k="${x.key}" data-v="n" title="Elendi">✗</button></div>`; }).join("")
      : `<div class="empty">Bu takımdan madde gelmedi.</div>`}</div>
    <div class="scorebar">
      <span class="acc">Toplam <b>${items.length}</b> madde · Geçerli <b>${acc}</b></span>
      <span class="sp"></span>
      ${items.length ? `<button class="btn-ghost" data-act="allyes">Tümünü onayla</button>` : ""}
      <input id="scoreInp" type="number" min="0" value="${esc(val)}">
      <button class="btn-main" data-act="savescore" style="font-size:17px;padding:12px 22px">${saved != null ? "Güncelle" : "Puanı kaydet"}</button>
    </div>`;
  const list = box.querySelector(".items");
  if(list){ list.style.scrollBehavior = "auto"; list.scrollTop = keepScroll; list.style.scrollBehavior = ""; }
  S.cur = keepCur;
  if(!S.cur){ const first = items.find(x => !S.marks[x.key]); S.cur = first ? first.key : null; }
  highlightCur(false);
}
function rboxSig(items){ return S.sel + "|" + items.map(x => x.key + x.tx + (S.marks[x.key] || "")).join("¦") + "|" + JSON.stringify(S.o.puanlar || {}); }
// Sayfayı yeniden çizmeden işaretleri günceller (kaydırma konumu korunur)
function applyMarks(){
  const box = $("rbox"); if(!box) return;
  const items = teamItems(S.sel);
  box.querySelectorAll(".item[data-key]").forEach(el => {
    const m = S.marks[el.dataset.key];
    el.classList.toggle("ok", m === "y"); el.classList.toggle("no-ok", m === "n");
    el.querySelector(".mk.y").classList.toggle("on", m === "y");
    el.querySelector(".mk.n").classList.toggle("on", m === "n");
  });
  const acc = items.filter(x => S.marks[x.key] === "y").length;
  const bs = box.querySelectorAll(".acc b"); if(bs[1]) bs[1].textContent = acc;
  const inp = $("scoreInp"); if(inp && S.edited[S.sel] == null) inp.value = acc || (S.o.puanlar || {})[S.sel] || 0;
  box.dataset.sig = rboxSig(items);
}
// Seçili satırı vurgular ve listeyi o satıra kaydırır
function highlightCur(scroll){
  const box = $("rbox"); if(!box) return;
  box.querySelectorAll(".item.cur").forEach(e => e.classList.remove("cur"));
  if(!S.cur) return;
  const el = box.querySelector(`.item[data-key="${S.cur}"]`); if(!el) return;
  el.classList.add("cur");
  if(scroll){
    const list = box.querySelector(".items");
    const top = el.offsetTop - (list.clientHeight - el.offsetHeight) / 2;
    if(list.scrollTo) list.scrollTo({ top: Math.max(0, top), behavior: "smooth" }); else list.scrollTop = Math.max(0, top);
  }
}
// İşaretlenen satırdan sonraki ilk işaretsiz satıra geç (yoksa bir sonrakine)
function rowKeys(){ const box = $("rbox"); return box ? Array.from(box.querySelectorAll(".item[data-key]")).map(e => e.dataset.key) : []; }
function isDone(k){ return S.screen === "esitlik" ? !!S.pot[k] : !!S.marks[k]; }
function goNext(fromKey){
  const keys = rowKeys();
  const i = keys.indexOf(fromKey);
  const after = keys.slice(i + 1);
  const nxt = after.find(k => !isDone(k)) || after[0] || null;
  if(nxt){ S.cur = nxt; highlightCur(true); }
  else { S.cur = fromKey; highlightCur(false); const inp = $("scoreInp"); if(inp) inp.scrollIntoView && inp.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
}
function markCur(v){
  if(!S.cur) return;
  S.marks[S.cur] = S.marks[S.cur] === v ? undefined : v; if(!S.marks[S.cur]) delete S.marks[S.cur];
  saveMarks(); delete S.edited[S.sel]; applyMarks();
  if(S.marks[S.cur]) goNext(S.cur);
}
async function saveScore(){
  const v = parseInt($("scoreInp").value, 10);
  if(isNaN(v) || v < 0) return toast("Geçerli bir puan girin", true);
  const p = Object.assign({}, S.o.puanlar || {}, { [S.sel]: v });
  await setSession({ puanlar: p });
  toast(T[S.sel].ad + " takımı: " + v + " puan");
  const next = activeTeams().find(t => p[t.id] == null);
  if(next){ S.sel = next.id; setSession({ aktif_takim: next.id }); }
}

/* --- Sonuç --- */
/* --- Sıralama & eşitlik --- */
function rankTeams(){
  const p = (S.o && S.o.puanlar) || {}, tb = p._esitlik || {};
  return activeTeams().map(t => ({ t, pts: p[t.id] != null ? p[t.id] : 0, tb: tb[t.id] }))
    .sort((a, b) => (b.pts - a.pts) || ((b.tb == null ? -1 : b.tb) - (a.tb == null ? -1 : a.tb)));
}
function topTied(){ const r = rankTeams(); return r.length ? r.filter(x => x.pts === r[0].pts) : []; }
function winnersOf(){
  const tied = topTied();
  if(tied.length < 2) return { winners: tied, tie: false, tbDone: false };
  const tbDone = tied.every(x => x.tb != null);
  if(!tbDone) return { winners: tied, tie: true, tbDone: false };
  const best = Math.max.apply(null, tied.map(x => x.tb));
  return { winners: tied.filter(x => x.tb === best), tie: true, tbDone: true };
}
function potItems(tid){
  const all = teamItems(tid), acc = all.filter(x => S.marks[x.key] === "y");
  return acc.length ? acc : all.filter(x => S.marks[x.key] !== "n");
}
function updTie(){
  const tied = topTied().map(x => x.t), tb = (S.o.puanlar || {})._esitlik || {};
  if(!S.sel || !tied.some(t => t.id === S.sel)) S.sel = tied[0] && tied[0].id;
  const tabs = $("tabs");
  tabs.style.gridTemplateColumns = `repeat(${Math.max(2, tied.length)},1fr)`;
  const tsig = "T" + S.sel + JSON.stringify(tb) + tied.map(t => t.id).join();
  if(tabs.dataset.sig !== tsig){
    tabs.dataset.sig = tsig;
    tabs.innerHTML = tied.map(t => `<button class="tab ${t.id === S.sel ? "on" : ""} ${tb[t.id] != null ? "done" : ""}" style="${tv(t)}" data-act="seltie" data-t="${t.id}"><b>${t.ad}</b><span class="sc">${tb[t.id] != null ? tb[t.id] + " potansiyel" : "Puanlanmadı"}</span></button>`).join("");
  }
  renderTbox();
  const done = tied.every(t => tb[t.id] != null);
  $("resBtn").disabled = !done;
  $("resHint").textContent = `${tied.filter(t => tb[t.id] != null).length}/${tied.length} takım puanlandı · Ana puan: ${topTied()[0] ? topTied()[0].pts : 0}`;
}
function potSum(tid){ return potItems(tid).reduce((a, x) => a + (S.pot[x.key] || 0), 0); }
function tboxSig(items){ return "T|" + S.sel + "|" + items.map(x => x.key + x.tx + (S.pot[x.key] || "")).join("¦") + "|" + JSON.stringify(((S.o.puanlar || {})._esitlik) || {}); }
function renderTbox(){
  const box = $("rbox"); if(!box || !S.sel) return;
  const t = T[S.sel], items = potItems(S.sel);
  const sig = tboxSig(items);
  if(box.dataset.sig === sig) return;
  const oldList = box.querySelector(".items");
  const keepScroll = box.dataset.team === "T" + S.sel && oldList ? oldList.scrollTop : 0;
  const keepCur = box.dataset.team === "T" + S.sel ? S.cur : null;
  box.dataset.sig = sig; box.dataset.team = "T" + S.sel;
  const saved = ((S.o.puanlar || {})._esitlik || {})[S.sel];
  box.innerHTML = `<div class="rhead" style="${tv(t)}"><h2>${t.ad} takımı</h2><span class="mem">Onaylanan ${items.length} risk</span></div>
    <div class="items">${items.length ? items.map((x, i) => { const v = S.pot[x.key];
      return `<div class="item ${v ? "potset" : ""}" data-key="${x.key}"><span class="no">${i + 1}.</span>
        <div class="tx">${esc(x.tx)}<span class="who">${esc(x.ad)}</span></div>
        ${[1, 2, 3].map(n => `<button class="pot ${v === n ? "on" : ""}" data-act="pot" data-k="${x.key}" data-v="${n}">${n}</button>`).join("")}</div>`; }).join("")
      : `<div class="empty">Bu takımın onaylanmış riski yok.</div>`}</div>
    <div class="scorebar">
      <span class="acc">Puanlanan <b id="potCnt">${items.filter(x => S.pot[x.key]).length}/${items.length}</b> · Potansiyel toplam <b id="potSum">${potSum(S.sel)}</b></span>
      <span class="sp"></span>
      <button class="btn-main" data-act="savetie" style="font-size:17px;padding:12px 22px">${saved != null ? "Güncelle" : "Potansiyel puanı kaydet"}</button>
    </div>`;
  const list = box.querySelector(".items");
  if(list){ list.style.scrollBehavior = "auto"; list.scrollTop = keepScroll; list.style.scrollBehavior = ""; }
  S.cur = keepCur;
  if(!S.cur){ const first = items.find(x => !S.pot[x.key]) || items[0]; S.cur = first ? first.key : null; }
  highlightCur(false);
}
function setPot(k, v){
  if(!k) return;
  S.cur = k;
  if(S.pot[k] === v) delete S.pot[k]; else S.pot[k] = v;
  saveMarks();
  const box = $("rbox"), el = box.querySelector(`.item[data-key="${k}"]`);
  if(el){ el.classList.toggle("potset", !!S.pot[k]); el.querySelectorAll(".pot").forEach(b => b.classList.toggle("on", +b.dataset.v === S.pot[k])); }
  const items = potItems(S.sel);
  $("potSum").textContent = potSum(S.sel);
  $("potCnt").textContent = items.filter(x => S.pot[x.key]).length + "/" + items.length;
  box.dataset.sig = tboxSig(items);
  if(S.pot[k]) goNext(k);
}
async function saveTie(){
  const p = Object.assign({}, S.o.puanlar || {});
  p._esitlik = Object.assign({}, p._esitlik || {}, { [S.sel]: potSum(S.sel) });
  await setSession({ puanlar: p });
  toast(T[S.sel].ad + " takımı: " + p._esitlik[S.sel] + " potansiyel puan");
  const next = topTied().find(x => p._esitlik[x.t.id] == null);
  if(next){ S.sel = next.t.id; S.cur = null; setSession({ aktif_takim: next.t.id }); }
}

function updResult(){
  const el = $("result"), p = S.o.puanlar || {};
  const teams = rankTeams();
  const sig = JSON.stringify(p) + S.kat.map(k => k.id + k.takim).join();
  if(el.dataset.sig === sig) return; el.dataset.sig = sig;
  if(!teams.length){ el.innerHTML = `<div class="empty">Takım yok.</div>`; return; }
  const W = winnersOf(), winners = W.winners;
  const pending = W.tie && !W.tbDone;
  const title = pending ? "Eşitlik var" : (winners.length > 1 ? "Berabere kalan takımlar" : "Kazanan takım");
  el.innerHTML = `<div class="crown">${title}</div>
    ${pending ? `<div class="tiebanner" style="font-size:22px;text-align:center;max-width:760px">${winners.map(w => w.t.ad).join(" ve ")} takımları ${winners[0].pts} puanla berabere.<small>Kazananı belirlemek için onaylanan riskler potansiyel şiddetine göre 1 ile 3 arasında puanlanacak.</small></div>
      <button class="btn-main" data-act="tiebreak">Potansiyel değerlendirmesini başlat</button>`
    : winners.map(w => `<div class="winner" style="${tv(w.t)}"><div class="tn">${w.t.ad} takımı</div><div class="ts">${w.pts} puan${W.tbDone ? `, ${w.tb} potansiyel puan` : ""}</div>
      <div class="names">${teamMembers(w.t.id).map(k => `<span>${esc(k.ad)}</span>`).join("")}</div></div>`).join("")}
    <div class="ranks ${teams.length > 5 ? "many" : ""}">${teams.map((x, i) => `<div class="rank"><span class="pos">${i + 1}.</span><span class="dot" style="${tv(x.t)}"></span>${x.t.ad}<span class="pts">${x.pts}</span>${x.tb != null ? `<small>+${x.tb} potansiyel</small>` : ""}</div>`).join("")}</div>
    <div class="row"><button class="btn-ghost" data-act="backreview">Değerlendirmeye dön</button>${W.tie && W.tbDone ? `<button class="btn-ghost" data-act="tiebreak">Potansiyel değerlendirmesini aç</button>` : ""}<button class="btn-ghost" data-act="again">Aynı takımlarla yeni tur</button><button class="btn-ghost" data-act="endsession">Oturumu kapat</button></div>`;
  if(!pending && el.dataset.conf !== sig){ el.dataset.conf = sig; confetti(); }
}
function confetti(){
  const c = $("confetti"); c.innerHTML = "";
  const cols = ["#f9d71c","#f28a1e","#e2231a","#7b2d8e","#4a5da8","#00aeef","#6cbe45"];
  for(let i = 0; i < 140; i++){
    const e = document.createElement("i");
    e.style.left = Math.random() * 100 + "vw"; e.style.background = cols[i % cols.length];
    e.style.animationDuration = (2.5 + Math.random() * 2.5) + "s"; e.style.animationDelay = Math.random() * 1.2 + "s";
    c.appendChild(e);
  }
  setTimeout(() => c.innerHTML = "", 6500);
}

/* --- Ayarlar modalı --- */
function openSettings(){
  const m = document.createElement("div"); m.className = "modal"; m.id = "modal";
  m.innerHTML = `<div class="card"><h3>Ayarlar</h3>
    <div class="field"><label>Görsel</label>${imgBoxHtml()}</div>
    <div class="row"><div class="field" style="max-width:180px"><label>Yazma süresi (sn)</label><input id="sureSet" type="number" min="5" max="600" value="${S.o ? S.o.sure : S.sure}"></div>
      <div class="field" style="max-width:220px"><label>Takım başına en fazla kişi</label><input id="maxSet" type="number" min="2" max="15" value="${S.maxKisi}"></div></div>
    <div class="field"><label>Katılım linki</label><input readonly value="${esc(joinUrl())}" onclick="this.select()"></div>
    <div class="row"><button class="btn-main" data-act="closeset" style="font-size:16px;padding:12px 22px">Kaydet ve kapat</button><span style="flex:1"></span><button class="btn-danger" data-act="endsession">Oturumu kapat</button></div></div>`;
  document.body.appendChild(m);
}

/* ---------- Olaylar ---------- */
document.addEventListener("change", e => {
  if(e.target.matches("[data-img]")){ loadImage(e.target.files[0]); const m = $("modal"); if(m) m.remove(); }
});
document.addEventListener("input", e => {
  if(e.target.id === "scoreInp" && S.sel) S.edited[S.sel] = e.target.value;
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ $("lightbox").hidden = true; }
  if(e.key === "Enter" && e.target.id === "scoreInp") return saveScore();
  if((S.screen === "degerlendirme" || S.screen === "esitlik") && !/INPUT|TEXTAREA/.test(e.target.tagName) && $("lightbox").hidden){
    const keys = rowKeys(), i = keys.indexOf(S.cur);
    if(S.screen === "esitlik"){
      if(["1","2","3"].includes(e.key)){ e.preventDefault(); return setPot(S.cur, +e.key); }
      if(e.key === "ArrowRight" || e.key === "ArrowLeft" || e.key === "Enter" || e.key === "Delete" || e.key === "Backspace") return;
    }
    if(e.key === "ArrowDown" || e.key === "PageDown"){ e.preventDefault(); if(i < keys.length - 1){ S.cur = keys[i + 1]; highlightCur(true); } }
    else if(e.key === "ArrowUp" || e.key === "PageUp"){ e.preventDefault(); if(i > 0){ S.cur = keys[i - 1]; highlightCur(true); } }
    else if(e.key === "ArrowRight" || e.key === "Enter"){ e.preventDefault(); markCur("y"); }
    else if(e.key === "ArrowLeft" || e.key === "Delete" || e.key === "Backspace"){ e.preventDefault(); markCur("n"); }
  }
});
$("lightbox").addEventListener("click", () => $("lightbox").hidden = true);

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  try{
    if(a === "savecfg"){ ls("eo_url", $("cfgUrl").value.trim()); ls("eo_key", $("cfgKey").value.trim()); if(initSb()){ render(); refresh(); } else toast("Bağlantı bilgisi eksik", true); }
    else if(a === "newsession"){
      const sure = Math.max(5, parseInt($("sureInp").value, 10) || 30); S.sure = sure; ls("eo_sure", String(sure));
      S.maxKisi = Math.max(2, parseInt($("maxInp").value, 10) || 5); ls("eo_max", String(S.maxKisi));
      const kod = Array.from({ length: 5 }, () => "ABCDEFGHJKLMNPRSTUVYZ23456789"[Math.floor(Math.random() * 29)]).join("");
      b.disabled = true;
      await api.createSession(kod, sure);
      S.kod = kod; ls("eo_kod", kod); S.o = { kod, durum: "lobi", sure, puanlar: {} }; S.kat = []; S.marks = {}; S.pot = {}; S.edited = {};
      render();
    }
    else if(a === "imgdel"){ S.gorsel = null; ls("eo_gorsel", null); S.screen = null; const m = $("modal"); if(m) m.remove(); render(); }
    else if(a === "kick"){ if(confirm("Bu katılımcı lobiden çıkarılsın mı?")){ await api.delKat(b.dataset.id); S.kat = S.kat.filter(k => k.id !== b.dataset.id); render(); } }
    else if(a === "draw" || a === "redraw"){ if(a === "redraw" && !confirm("Kura yeniden çekilsin mi? Takımlar değişecek.")) return; doDraw(); }
    else if(a === "startwrite"){ b.disabled = true; await startWrite(); }
    else if(a === "plus10"){ const nb = new Date(Math.max(Date.now(), new Date(S.o.bitis).getTime()) + 10000).toISOString(); S.ending = false; await setSession({ bitis: nb }); }
    else if(a === "endnow"){ if(confirm("Süre şimdi bitirilsin mi?")) await setSession({ bitis: new Date().toISOString() }); }
    else if(a === "zoom"){ if(S.gorsel){ $("lightbox").querySelector("img").src = S.gorsel; $("lightbox").hidden = false; } }
    else if(a === "seltab"){ S.sel = b.dataset.t; S.cur = null; updReview(); setSession({ aktif_takim: S.sel }); }
    else if(a === "mark"){ S.cur = b.dataset.k; markCur(b.dataset.v); }
    else if(a === "allyes"){ teamItems(S.sel).forEach(x => { if(!S.marks[x.key]) S.marks[x.key] = "y"; }); saveMarks(); delete S.edited[S.sel]; applyMarks(); }
    else if(a === "savescore"){ await saveScore(); }
    else if(a === "tiebreak"){ const t = topTied(); S.sel = t[0] && t[0].t.id; S.cur = null; await setSession({ durum: "esitlik", aktif_takim: S.sel }); }
    else if(a === "seltie"){ S.sel = b.dataset.t; S.cur = null; updTie(); setSession({ aktif_takim: S.sel }); }
    else if(a === "pot"){ setPot(b.dataset.k, +b.dataset.v); }
    else if(a === "savetie"){ await saveTie(); }
    else if(a === "showresult"){ await setSession({ durum: "sonuc", aktif_takim: null }); }
    else if(a === "backreview"){ await setSession({ durum: "degerlendirme" }); }
    else if(a === "again"){ if(confirm("Aynı takımlarla yeni tur başlasın mı? (Puanlar ve maddeler sıfırlanır, yeni görsel yükleyebilirsiniz)")){ S.marks = {}; S.pot = {}; S.edited = {}; saveMarks(); await setSession({ durum: "takimlar", puanlar: {}, aktif_takim: null, bitis: null }); } }
    else if(a === "settings"){ openSettings(); }
    else if(a === "closeset"){ S.maxKisi = Math.max(2, parseInt($("maxSet").value, 10) || 5); ls("eo_max", String(S.maxKisi)); const v = Math.max(5, parseInt($("sureSet").value, 10) || 30); S.sure = v; ls("eo_sure", String(v)); $("modal").remove(); if(S.o && S.o.sure !== v) await setSession({ sure: v }); }
    else if(a === "endsession"){
      if(!confirm("Oturum kapatılsın mı? Yeni bir QR ile yeni oturum başlatabilirsiniz.")) return;
      const m = $("modal"); if(m) m.remove();
      ls("eo_marks_" + S.kod, null); S.kod = null; ls("eo_kod", null); S.o = null; S.kat = []; S.drawing = null; render();
    }
  }catch(err){ showErr(err); }
});

/* ---------- Başlat ---------- */
function boot(){
  if(initSb()){
    try{
      sb.channel("eo_admin").on("postgres_changes", { event: "*", schema: "public", table: "egitim_katilimci" }, () => refresh()).subscribe();
    }catch(e){ console.warn(e); }
  }
  render(); refresh();
  setInterval(refresh, 2000);
}
boot();
</script>
</body>
</html>
