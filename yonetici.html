<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Risk Avı — Yönetici</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1f2630; --line:#2d3540; --text:#eef2f6; --muted:#8b97a5;
  --accent:#ff7a1a; --ok:#2fbf71; --bad:#e5484d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--panel2);color:var(--text);transition:.15s}
button:hover:not(:disabled){filter:brightness(1.15)}
button:disabled{opacity:.4;cursor:not-allowed}
.btn-main{background:var(--accent);color:#1a0d00;font-size:20px;padding:16px 32px;font-weight:800}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn-danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
input,select{font:inherit;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.app{min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-weight:900;font-size:20px;letter-spacing:-.3px}
.brand span{color:var(--accent)}
.top .sp{flex:1}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--muted)}
.pill b{color:var(--text)}
.ver{font-size:12px;color:var(--muted)}
.stage{flex:1;padding:24px;display:flex;flex-direction:column;gap:20px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(120px);background:#222b36;border:1px solid var(--line);padding:12px 22px;border-radius:12px;font-weight:600;transition:.25s;z-index:99;max-width:90vw}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--bad);color:#ffb3b5}

/* Kurulum */
.setup{max-width:720px;margin:40px auto;width:100%;display:flex;flex-direction:column;gap:22px}
.setup h1{font-size:46px;font-weight:900;letter-spacing:-1.5px;line-height:1}
.setup h1 span{color:var(--accent)}
.setup .lead{color:var(--muted);font-size:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:160px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.imgbox{display:flex;gap:16px;align-items:center}
.imgbox .thumb{width:160px;height:100px;border-radius:10px;background:var(--panel2) center/cover no-repeat;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;flex-shrink:0}
.filebtn{position:relative;overflow:hidden;display:inline-block}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* Lobi */
.lobby{display:grid;grid-template-columns:minmax(340px,440px) 1fr;gap:24px;flex:1}
.qrcard{background:#fff;color:#111;border-radius:24px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:14px;align-self:start}
.qrcard h2{font-size:26px;font-weight:900;text-align:center;line-height:1.1}
#qr{width:340px;height:340px;display:flex;align-items:center;justify-content:center}
#qr img,#qr canvas{width:340px!important;height:340px!important}
.qrcard .link{font-size:12px;color:#555;word-break:break-all;text-align:center}
.qrcard .kod{font-size:14px;color:#555}.qrcard .kod b{font-size:22px;color:#111;letter-spacing:3px}
.people{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:18px}
.count{font-size:22px;color:var(--muted);font-weight:600}
.count b{font-size:64px;color:var(--text);font-weight:900;margin-right:10px;vertical-align:-6px}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:9px 10px 9px 16px;font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px;animation:pop .35s ease}
.chip .x{background:none;padding:0 6px;color:var(--muted);font-size:18px;border-radius:6px}
.chip .x:hover{color:var(--bad)}
.empty{color:var(--muted);font-size:18px;padding:30px 0}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.bar{display:flex;gap:14px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.bar .hint{color:var(--muted);margin-right:auto}

/* Takımlar */
.teams{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;flex:1}
.team{border-radius:20px;overflow:hidden;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column}
.team .th{padding:14px 16px;font-weight:900;font-size:22px;display:flex;justify-content:space-between;align-items:center}
.team .th small{font-size:15px;font-weight:700;opacity:.85}
.team ul{list-style:none;padding:12px;display:flex;flex-direction:column;gap:6px}
.team li{background:var(--panel2);border-radius:10px;padding:10px 14px;font-weight:600;font-size:17px;animation:drop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-30px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.kura-title{text-align:center;font-size:34px;font-weight:900}
.kura-now{text-align:center;font-size:56px;font-weight:900;min-height:70px;letter-spacing:-1px}

/* Yazma */
.write{display:grid;grid-template-columns:1fr 340px;gap:20px;flex:1;min-height:0}
.imgstage{background:#000;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:60vh;position:relative;cursor:zoom-in}
.imgstage img{max-width:100%;max-height:calc(100vh - 150px);object-fit:contain;display:block}
.imgstage .noimg{color:var(--muted);font-size:18px;padding:40px;text-align:center}
.side{display:flex;flex-direction:column;gap:16px}
.timer{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center}
.timer .big{font-size:110px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.timer .big.low{color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.timer .lbl{color:var(--muted);font-weight:600;margin-top:6px}
.prog{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s linear}
.tstats{display:flex;flex-direction:column;gap:8px}
.tstat{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:700}
.dot{width:16px;height:16px;border-radius:50%;flex-shrink:0}
.tstat .n{margin-left:auto;font-size:26px;font-weight:900}
.tstat small{color:var(--muted);font-weight:600}

/* Değerlendirme */
.review{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;flex:1;min-height:0}
.review .imgstage{min-height:auto;position:sticky;top:20px;align-self:start;height:calc(100vh - 130px)}
.review .imgstage img{max-height:100%}
.rpanel{display:flex;flex-direction:column;gap:14px;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tab{padding:14px 6px;border-radius:14px;font-weight:900;font-size:15px;border:3px solid transparent;position:relative;opacity:.55}
.tab.on{opacity:1;border-color:#fff;transform:translateY(-2px)}
.tab .sc{display:block;font-size:13px;font-weight:700;margin-top:3px;opacity:.9}
.rbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.rhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rhead h2{font-size:30px;font-weight:900}
.rhead .mem{color:var(--muted);font-size:14px}
.items{display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:calc(100vh - 420px);padding-right:4px}
.item{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:10px 12px;border:2px solid transparent}
.item .no{color:var(--muted);font-weight:800;width:26px;text-align:right;flex-shrink:0}
.item .tx{flex:1;font-size:19px;font-weight:600;line-height:1.3;word-break:break-word}
.item .who{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.item .dup{font-size:11px;background:#5a4300;color:#ffd666;padding:2px 7px;border-radius:6px;margin-left:6px;font-weight:700}
.item.ok{border-color:var(--ok);background:rgba(47,191,113,.12)}
.item.no-ok{opacity:.45}.item.no-ok .tx{text-decoration:line-through}
.mk{width:42px;height:42px;padding:0;font-size:20px;border-radius:10px;flex-shrink:0;background:var(--panel)}
.mk.y.on{background:var(--ok);color:#04220f}
.mk.n.on{background:var(--bad);color:#fff}
.scorebar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.scorebar .acc{color:var(--muted);font-weight:600}.scorebar .acc b{color:var(--ok);font-size:22px}
.scorebar input{width:110px;font-size:28px;font-weight:900;text-align:center;padding:8px}
.scorebar .sp{flex:1}

/* Sonuç */
.result{flex:1;display:flex;flex-direction:column;align-items:center;gap:26px;padding-top:10px}
.crown{font-size:22px;letter-spacing:6px;color:var(--muted);font-weight:800}
.winner{border-radius:30px;padding:34px 60px;text-align:center;animation:win 1s cubic-bezier(.2,1.5,.4,1);box-shadow:0 30px 80px rgba(0,0,0,.5);max-width:1100px;width:100%}
@keyframes win{from{transform:scale(.3) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.winner .tn{font-size:84px;font-weight:900;letter-spacing:-2px;line-height:1}
.winner .ts{font-size:30px;font-weight:800;margin-top:6px;opacity:.9}
.winner .names{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.winner .names span{background:rgba(255,255,255,.2);padding:9px 16px;border-radius:999px;font-weight:700;font-size:20px}
.ranks{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.rank{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 22px;display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}
.rank .pos{color:var(--muted)}
.rank .pts{font-size:28px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:80;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox img{max-width:98vw;max-height:98vh}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{max-width:560px;width:100%}
[hidden]{display:none!important}
@media (max-width:1000px){.lobby,.write,.review{grid-template-columns:1fr}.teams{grid-template-columns:repeat(2,1fr)}.review .imgstage{position:static;height:50vh}.items{max-height:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox" hidden><img alt=""></div>
<div class="confetti" id="confetti"></div>

<script>
/* ================= AYARLAR ================= */
const VERSION = "v2.0";
// Supabase proje bilgileri (BETEK Cup projesi). Anon key'i buraya yapıştırırsanız hiçbir cihazda elle girmeye gerek kalmaz.
const DEFAULT_SUPABASE_URL = "https://arjecfiigkebkeccfpxi.supabase.co";
const DEFAULT_SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyamVjZmlpZ2tlYmtlY2NmcHhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NDg5NzEsImV4cCI6MjEwNTEyNDk3MX0.YhcLALmCr8IQjTuBZTkJKSjIW8TlXpT6oOzPcgAc2k8";
const KATIL_SAYFASI = "katil.html";
/* =========================================== */

const TEAMS = [
  {id:"fusya",   ad:"FUŞYA",   renk:"#C2185B", yazi:"#fff"},
  {id:"ekru",    ad:"EKRU",    renk:"#D8C7A0", yazi:"#2a2216"},
  {id:"roze",    ad:"ROZE",    renk:"#F48FB1", yazi:"#3a0d1c"},
  {id:"somon",   ad:"SOMON",   renk:"#FF8A65", yazi:"#3a1206"},
  {id:"manolya", ad:"MANOLYA", renk:"#8E63B5", yazi:"#fff"}
];
const T = Object.fromEntries(TEAMS.map(t => [t.id, t]));

function ls(k, v){ try{ if(v === undefined) return localStorage.getItem(k); if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){ return null; } }
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const norm = s => String(s||"").toLocaleLowerCase("tr").replace(/[^\p{L}\p{N}]+/gu," ").trim();

function toast(msg, err){ const t = $("toast"); t.textContent = msg; t.className = "toast on" + (err ? " err" : ""); clearTimeout(toast._t); toast._t = setTimeout(() => t.className = "toast", err ? 5000 : 2200); }
function showErr(e){ console.error(e); toast("Hata: " + (e && (e.message || e.details) || e), true); }

/* ---------- Supabase ---------- */
let sb = null;
function getCfg(){ const p = new URLSearchParams(location.search); return { url: p.get("u") || ls("eo_url") || DEFAULT_SUPABASE_URL, key: p.get("k") || ls("eo_key") || DEFAULT_SUPABASE_KEY }; }
function initSb(){ const c = getCfg(); if(!c.url || !c.key || !window.supabase) return false; sb = window.supabase.createClient(c.url, c.key); return true; }
async function q(p){ const { data, error } = await p; if(error) throw error; return data; }
const api = {
  getSession: k => q(sb.from("egitim_oturum").select("*").eq("kod", k).maybeSingle()),
  createSession: (k, sure) => q(sb.from("egitim_oturum").insert({ kod:k, durum:"lobi", sure, puanlar:{} })),
  updSession: (k, p) => q(sb.from("egitim_oturum").update(p).eq("kod", k)),
  listKat: k => q(sb.from("egitim_katilimci").select("*").eq("oturum", k).order("created_at", { ascending:true })),
  upsertKat: rows => q(sb.from("egitim_katilimci").upsert(rows)),
  updKat: (id, p) => q(sb.from("egitim_katilimci").update(p).eq("id", id)),
  delKat: id => q(sb.from("egitim_katilimci").delete().eq("id", id)),
  clearMaddeler: k => q(sb.from("egitim_katilimci").update({ maddeler: [] }).eq("oturum", k))
};

/* ---------- Durum ---------- */
const S = {
  kod: ls("eo_kod") || null,
  o: null,              // oturum satırı
  kat: [],              // katılımcılar
  gorsel: ls("eo_gorsel") || null,
  sure: parseInt(ls("eo_sure") || "30", 10) || 30,
  screen: null,
  drawing: null,        // kura animasyonu durumu
  sel: null,            // değerlendirmede seçili takım
  marks: {},            // { "pid:idx": "y"|"n" }
  edited: {},           // elle girilmiş puan
  ending: false,
  seq: 0
};
try{ S.marks = JSON.parse(ls("eo_marks_" + S.kod) || "{}"); }catch(e){ S.marks = {}; }

function saveMarks(){ ls("eo_marks_" + S.kod, JSON.stringify(S.marks)); }
function teamMembers(tid){ return S.kat.filter(k => k.takim === tid); }
function activeTeams(){ return TEAMS.filter(t => teamMembers(t.id).length > 0); }
function joinUrl(){
  const base = location.href.split("?")[0].split("#")[0].replace(/[^\/]*$/, "") + KATIL_SAYFASI;
  let u = base + "?o=" + encodeURIComponent(S.kod);
  const c = getCfg();
  if(c.url !== DEFAULT_SUPABASE_URL) u += "&u=" + encodeURIComponent(c.url);
  if(c.key !== DEFAULT_SUPABASE_KEY) u += "&k=" + encodeURIComponent(c.key);
  return u;
}

async function setSession(patch){
  S.seq++;
  S.o = Object.assign({}, S.o, patch);
  render();
  try{ await api.updSession(S.kod, patch); }catch(e){ showErr(e); }
  S.seq++;
}

async function refresh(){
  if(!sb || !S.kod) return;
  const seq = S.seq;
  try{
    const [o, k] = await Promise.all([api.getSession(S.kod), api.listKat(S.kod)]);
    if(seq !== S.seq) return; // arada yazma oldu, eski veriyi uygulama
    if(!o){ S.kod = null; ls("eo_kod", null); S.o = null; render(); return; }
    S.o = o; S.kat = k || [];
    render();
  }catch(e){ console.warn(e); }
}

/* ---------- Görsel ---------- */
function loadImage(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1920, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img, 0, 0, c.width, c.height);
      S.gorsel = c.toDataURL("image/jpeg", 0.88);
      ls("eo_gorsel", S.gorsel);
      S.screen = null; render(); toast("Görsel yüklendi");
    };
    img.onerror = () => toast("Görsel okunamadı", true);
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
function imgBoxHtml(){
  return `<div class="imgbox">
    <div class="thumb" style="${S.gorsel ? `background-image:url(${S.gorsel})` : ""}">${S.gorsel ? "" : "Görsel yok"}</div>
    <div class="row">
      <label class="filebtn"><button type="button">${S.gorsel ? "Görseli Değiştir" : "Görsel Yükle"}</button><input type="file" accept="image/*" data-img></label>
      ${S.gorsel ? `<button type="button" class="btn-ghost" data-act="imgdel">Kaldır</button>` : ""}
    </div></div>`;
}
function imgStageHtml(){
  return `<div class="imgstage" data-act="zoom">${S.gorsel ? `<img src="${S.gorsel}" alt="Görsel">` : `<div class="noimg">Görsel yüklenmedi.<br>Üstteki ⚙ Ayarlar'dan yükleyebilirsiniz.</div>`}</div>`;
}

/* ---------- Ekranlar ---------- */
function currentScreen(){
  if(!sb) return "baglanti";
  if(!S.kod) return "kurulum";
  if(!S.o) return "yukleniyor";
  if(S.drawing) return "kura";
  return S.o.durum;
}

function topHtml(){
  return `<div class="top">
    <div class="brand">Risk <span>Avı</span></div>
    ${S.kod ? `<div class="pill">Oturum <b>${esc(S.kod)}</b></div><div class="pill"><b>${S.kat.length}</b> katılımcı</div>` : ""}
    <div class="sp"></div>
    <span class="ver">${VERSION}</span>
    ${S.kod ? `<button class="btn-ghost" data-act="settings">⚙ Ayarlar</button>` : ""}
  </div>`;
}

function render(){
  const scr = currentScreen();
  const app = $("app");
  if(scr !== S.screen){
    S.screen = scr;
    app.innerHTML = topHtml() + `<div class="stage" id="stage">${skeleton(scr)}</div>`;
    afterSkeleton(scr);
  } else {
    const top = app.querySelector(".top"); if(top) top.outerHTML = topHtml();
  }
  update(scr);
}

function skeleton(scr){
  switch(scr){
    case "baglanti": return `<div class="setup">
      <h1>Risk <span>Avı</span></h1>
      <p class="lead">Supabase bağlantısı tanımlı değil. Proje bilgilerini girin (bir kez yeterli — bu cihazda saklanır).</p>
      <div class="card">
        <div class="field"><label>Project URL</label><input id="cfgUrl" value="${esc(getCfg().url)}"></div>
        <div class="field"><label>anon public key</label><input id="cfgKey" value="${esc(getCfg().key)}"></div>
        <div class="row"><button class="btn-main" data-act="savecfg">Kaydet ve Bağlan</button></div>
      </div></div>`;
    case "kurulum": return `<div class="setup">
      <h1>Risk <span>Avı</span></h1>
      <p class="lead">Katılımcılar QR ile lobiye girer, kura ile 5 takıma ayrılır, gösterilen görselde gördükleri riskleri madde madde yazarlar.</p>
      <div class="card"><h3>1 · Görsel</h3>${imgBoxHtml()}</div>
      <div class="card"><h3>2 · Yazma süresi</h3>
        <div class="row"><div class="field" style="max-width:180px"><label>Saniye</label><input id="sureInp" type="number" min="5" max="600" value="${S.sure}"></div></div>
      </div>
      <div class="row"><button class="btn-main" data-act="newsession">Yeni Oturum Başlat ▶</button></div>
    </div>`;
    case "yukleniyor": return `<div class="empty">Yükleniyor…</div>`;
    case "lobi": return `<div class="lobby">
        <div class="qrcard"><h2>Telefonunuzla okutun,<br>lobiye katılın</h2><div id="qr"></div>
          <div class="kod">Oturum kodu: <b>${esc(S.kod)}</b></div><div class="link">${esc(joinUrl())}</div></div>
        <div class="people"><div class="count"><b id="cnt">0</b>katılımcı lobide</div><div class="chips" id="plist"></div></div>
      </div>
      <div class="bar"><span class="hint" id="drawHint"></span><button class="btn-main" data-act="draw" id="drawBtn">Kurayı Başlat 🎲</button></div>`;
    case "kura": return `<div class="kura-title">Takımlar belirleniyor…</div><div class="kura-now" id="kuraNow"></div>
      <div class="teams" id="teams">${TEAMS.map(t => `<div class="team"><div class="th" style="background:${t.renk};color:${t.yazi}">${t.ad}<small id="kc_${t.id}">0</small></div><ul id="kl_${t.id}"></ul></div>`).join("")}</div>`;
    case "takimlar": return `<div class="teams" id="teams"></div>
      <div class="bar"><span class="hint">Katılımcılar kendi ekranlarında takımlarını görüyor. Hazır olduğunuzda yazma turunu başlatın.</span>
        <button class="btn-ghost" data-act="redraw">↻ Kurayı Yeniden Çek</button>
        <button class="btn-main" data-act="startwrite" id="startBtn"></button></div>`;
    case "yazma": return `<div class="write">${imgStageHtml()}
      <div class="side">
        <div class="timer"><div class="big" id="tBig">--</div><div class="lbl" id="tLbl">saniye kaldı</div><div class="prog"><i id="tProg"></i></div></div>
        <div class="tstats" id="tstats"></div>
        <div class="row"><button data-act="plus10">+10 sn</button><button class="btn-danger" data-act="endnow">Süreyi Bitir</button></div>
      </div></div>`;
    case "degerlendirme": return `<div class="review">${imgStageHtml()}
      <div class="rpanel"><div class="tabs" id="tabs"></div>
        <div class="rbox" id="rbox"></div>
        <div class="bar"><span class="hint" id="resHint"></span><button class="btn-main" data-act="showresult" id="resBtn">Sonuçları Göster 🏆</button></div>
      </div></div>`;
    case "sonuc": return `<div class="result" id="result"></div>`;
    default: return `<div class="empty">Bilinmeyen durum: ${esc(scr)}</div>`;
  }
}

function afterSkeleton(scr){
  if(scr === "lobi"){
    const el = $("qr"); el.innerHTML = "";
    try{ new QRCode(el, { text: joinUrl(), width: 680, height: 680, correctLevel: QRCode.CorrectLevel.M }); }catch(e){ el.textContent = "QR oluşturulamadı"; }
  }
  if(scr === "sonuc") confetti();
}

function update(scr){
  if(scr === "lobi") updLobby();
  else if(scr === "takimlar") updTeams();
  else if(scr === "yazma") updWrite();
  else if(scr === "degerlendirme") updReview();
  else if(scr === "sonuc") updResult();
}

/* --- Lobi --- */
function updLobby(){
  $("cnt").textContent = S.kat.length;
  const sig = S.kat.map(k => k.id + k.ad).join("|");
  const pl = $("plist");
  if(pl.dataset.sig !== sig){
    pl.dataset.sig = sig;
    pl.innerHTML = S.kat.length ? S.kat.map(k => `<span class="chip">${esc(k.ad)}<button class="x" title="Çıkar" data-act="kick" data-id="${k.id}">×</button></span>`).join("")
      : `<div class="empty">Henüz kimse yok. QR kodu okutmalarını bekleyin…</div>`;
  }
  $("drawBtn").disabled = S.kat.length < 1;
  const N = TEAMS.length, n = S.kat.length, base = Math.floor(n / N), extra = n % N;
  $("drawHint").textContent = n ? "Dağılım: " + TEAMS.map((t, i) => base + (i < extra ? 1 : 0)).join(" – ") + (n < N ? `  (${N}'ten az kişi: bazı takımlar boş kalacak)` : "") : "";
}

/* --- Kura --- */
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function balancedAssign(people){
  const order = shuffle(TEAMS.map(t => t.id)); // fazla kişinin hangi takımlara düşeceği de rastgele
  return shuffle(people).map((p, i) => ({ p, takim: order[i % order.length] }));
}
async function doDraw(){
  if(!S.kat.length) return;
  const plan = balancedAssign(S.kat);
  try{
    await api.upsertKat(plan.map(x => ({ id: x.p.id, oturum: S.kod, ad: x.p.ad, takim: x.takim })));
  }catch(e){ return showErr(e); }
  plan.forEach(x => x.p.takim = x.takim);
  S.drawing = { plan, i: 0 };
  render();
  const step = Math.max(160, Math.min(450, 9000 / plan.length));
  await new Promise(res => {
    const tick = () => {
      if(!S.drawing) return res();
      const d = S.drawing;
      if(d.i >= d.plan.length) return res();
      const x = d.plan[d.i++], t = T[x.takim];
      const now = $("kuraNow"); now.textContent = x.p.ad; now.style.color = t.renk;
      const li = document.createElement("li"); li.textContent = x.p.ad; $("kl_" + x.takim).appendChild(li);
      const c = $("kc_" + x.takim); c.textContent = +c.textContent + 1;
      setTimeout(tick, step);
    };
    setTimeout(tick, 600);
  });
  await new Promise(r => setTimeout(r, 900));
  S.drawing = null;
  S.marks = {}; S.edited = {}; saveMarks();
  await setSession({ durum: "takimlar", puanlar: {}, aktif_takim: null, bitis: null });
}

/* --- Takımlar --- */
function teamsGridHtml(){
  return TEAMS.map(t => { const m = teamMembers(t.id);
    return `<div class="team"><div class="th" style="background:${t.renk};color:${t.yazi}">${t.ad}<small>${m.length} kişi</small></div><ul>${m.map(k => `<li>${esc(k.ad)}</li>`).join("")}</ul></div>`; }).join("");
}
function updTeams(){
  const sig = S.kat.map(k => k.id + k.takim).join("|");
  const el = $("teams");
  if(el.dataset.sig !== sig){ el.dataset.sig = sig; el.innerHTML = teamsGridHtml(); }
  $("startBtn").textContent = `Yazma Turunu Başlat (${S.o.sure || S.sure} sn) ▶`;
}

async function startWrite(){
  // takımsız kalan (geç katılan) varsa en küçük takıma ata
  const loose = S.kat.filter(k => !k.takim || !T[k.takim]);
  if(loose.length){
    const rows = [];
    loose.forEach(k => {
      const t = TEAMS.slice().sort((a, b) => teamMembers(a.id).length - teamMembers(b.id).length)[0].id;
      k.takim = t; rows.push({ id: k.id, oturum: S.kod, ad: k.ad, takim: t });
    });
    try{ await api.upsertKat(rows); }catch(e){ return showErr(e); }
  }
  try{ await api.clearMaddeler(S.kod); }catch(e){ return showErr(e); }
  S.kat.forEach(k => k.maddeler = []);
  S.marks = {}; S.edited = {}; saveMarks(); S.ending = false;
  const sure = S.o.sure || S.sure;
  await setSession({ durum: "yazma", bitis: new Date(Date.now() + (sure + 1) * 1000).toISOString(), puanlar: {}, aktif_takim: null });
}

/* --- Yazma --- */
function remainingMs(){ return S.o && S.o.bitis ? new Date(S.o.bitis).getTime() - Date.now() : 0; }
function updWrite(){
  const sig = S.kat.map(k => k.id + ":" + (k.maddeler || []).length + k.takim).join("|");
  const el = $("tstats");
  if(el.dataset.sig !== sig){
    el.dataset.sig = sig;
    el.innerHTML = activeTeams().map(t => { const m = teamMembers(t.id); const n = m.reduce((a, k) => a + (k.maddeler || []).length, 0);
      return `<div class="tstat"><span class="dot" style="background:${t.renk}"></span>${t.ad}<small>&nbsp;${m.length} kişi</small><span class="n">${n}</span></div>`; }).join("")
      + `<div style="color:var(--muted);font-size:13px;text-align:right">yazılan madde sayısı (canlı)</div>`;
  }
  tickWrite();
}
function tickWrite(){
  if(S.screen !== "yazma") return;
  const ms = remainingMs(), sure = (S.o.sure || S.sure) * 1000;
  const sec = Math.max(0, Math.ceil(ms / 1000));
  const big = $("tBig"); big.textContent = sec; big.classList.toggle("low", sec <= 5 && sec > 0);
  $("tProg").style.width = Math.max(0, Math.min(100, ms / sure * 100)) + "%";
  $("tLbl").textContent = sec > 0 ? "saniye kaldı" : "Süre doldu — cevaplar toplanıyor…";
  if(ms <= 0 && !S.ending){
    S.ending = true;
    setTimeout(async () => {
      if(S.o.durum !== "yazma") return;
      await refresh();
      const first = activeTeams()[0];
      S.sel = first ? first.id : null;
      await setSession({ durum: "degerlendirme", aktif_takim: S.sel });
    }, 2500);
  }
}
setInterval(tickWrite, 200);

/* --- Değerlendirme --- */
function teamItems(tid){
  const out = [];
  teamMembers(tid).forEach(k => (k.maddeler || []).forEach((tx, i) => { if(String(tx).trim()) out.push({ key: k.id + ":" + i, tx: String(tx).trim(), ad: k.ad }); }));
  const seen = {};
  out.forEach(x => { const n = norm(x.tx); x.dup = !!seen[n]; seen[n] = true; });
  return out;
}
function acceptedCount(tid){ return teamItems(tid).filter(x => S.marks[x.key] === "y").length; }
function updReview(){
  const teams = activeTeams();
  if(!S.sel || !teamMembers(S.sel).length) S.sel = S.o.aktif_takim && teamMembers(S.o.aktif_takim).length ? S.o.aktif_takim : (teams[0] && teams[0].id);
  const p = S.o.puanlar || {};
  const tabs = $("tabs");
  const tsig = S.sel + JSON.stringify(p) + teams.map(t => t.id).join();
  if(tabs.dataset.sig !== tsig){
    tabs.dataset.sig = tsig;
    tabs.innerHTML = TEAMS.map(t => { const has = teamMembers(t.id).length;
      return `<button class="tab ${t.id === S.sel ? "on" : ""}" style="background:${t.renk};color:${t.yazi}" data-act="seltab" data-t="${t.id}" ${has ? "" : "disabled"}>${t.ad}<span class="sc">${p[t.id] != null ? "✓ " + p[t.id] + " puan" : (has ? "puan yok" : "boş")}</span></button>`; }).join("");
  }
  renderRbox();
  const done = teams.every(t => p[t.id] != null);
  $("resBtn").disabled = !done;
  $("resHint").textContent = done ? "Tüm takımlar puanlandı." : `${teams.filter(t => p[t.id] != null).length}/${teams.length} takım puanlandı`;
}
function renderRbox(){
  const box = $("rbox"); if(!box || !S.sel) return;
  const t = T[S.sel], items = teamItems(S.sel), mem = teamMembers(S.sel);
  const sig = S.sel + "|" + items.map(x => x.key + x.tx + (S.marks[x.key] || "")).join("¦") + "|" + JSON.stringify(S.o.puanlar || {});
  if(box.dataset.sig === sig) return;
  box.dataset.sig = sig; box.dataset.team = S.sel;
  const acc = items.filter(x => S.marks[x.key] === "y").length;
  const saved = (S.o.puanlar || {})[S.sel];
  const val = S.edited[S.sel] != null ? S.edited[S.sel] : (acc || saved || 0);
  box.innerHTML = `<div class="rhead"><h2 style="color:${t.renk}">${t.ad} TAKIM</h2><span class="mem">${mem.map(k => esc(k.ad)).join(", ")}</span></div>
    <div class="items">${items.length ? items.map((x, i) => { const m = S.marks[x.key];
      return `<div class="item ${m === "y" ? "ok" : m === "n" ? "no-ok" : ""}"><span class="no">${i + 1}.</span>
        <div class="tx">${esc(x.tx)}${x.dup ? `<span class="dup">TEKRAR</span>` : ""}<span class="who">${esc(x.ad)}</span></div>
        <button class="mk y ${m === "y" ? "on" : ""}" data-act="mark" data-k="${x.key}" data-v="y" title="Geçerli">✓</button>
        <button class="mk n ${m === "n" ? "on" : ""}" data-act="mark" data-k="${x.key}" data-v="n" title="Elendi">✗</button></div>`; }).join("")
      : `<div class="empty">Bu takımdan madde gelmedi.</div>`}</div>
    <div class="scorebar">
      <span class="acc">Toplam <b>${items.length}</b> madde · Geçerli <b>${acc}</b></span>
      <span class="sp"></span>
      ${items.length ? `<button class="btn-ghost" data-act="allyes">Tümü ✓</button>` : ""}
      <input id="scoreInp" type="number" min="0" value="${esc(val)}">
      <button class="btn-main" data-act="savescore" style="font-size:17px;padding:12px 22px">${saved != null ? "Güncelle" : "Puanı Kaydet"}</button>
    </div>`;
}
async function saveScore(){
  const v = parseInt($("scoreInp").value, 10);
  if(isNaN(v) || v < 0) return toast("Geçerli bir puan girin", true);
  const p = Object.assign({}, S.o.puanlar || {}, { [S.sel]: v });
  await setSession({ puanlar: p });
  toast(T[S.sel].ad + " takımı: " + v + " puan");
  const next = activeTeams().find(t => p[t.id] == null);
  if(next){ S.sel = next.id; setSession({ aktif_takim: next.id }); }
}

/* --- Sonuç --- */
function updResult(){
  const el = $("result"), p = S.o.puanlar || {};
  const teams = activeTeams().map(t => ({ t, pts: p[t.id] != null ? p[t.id] : 0 })).sort((a, b) => b.pts - a.pts);
  const sig = JSON.stringify(p) + S.kat.map(k => k.id + k.takim).join();
  if(el.dataset.sig === sig) return; el.dataset.sig = sig;
  if(!teams.length){ el.innerHTML = `<div class="empty">Takım yok.</div>`; return; }
  const top = teams[0].pts, winners = teams.filter(x => x.pts === top);
  el.innerHTML = `<div class="crown">🏆 ${winners.length > 1 ? "BERABERLİK — KAZANANLAR" : "KAZANAN TAKIM"} 🏆</div>
    ${winners.map(w => `<div class="winner" style="background:${w.t.renk};color:${w.t.yazi}"><div class="tn">${w.t.ad} TAKIM</div><div class="ts">${w.pts} puan</div>
      <div class="names">${teamMembers(w.t.id).map(k => `<span>${esc(k.ad)}</span>`).join("")}</div></div>`).join("")}
    <div class="ranks">${teams.map((x, i) => `<div class="rank"><span class="pos">${i + 1}.</span><span class="dot" style="background:${x.t.renk}"></span>${x.t.ad}<span class="pts">${x.pts}</span></div>`).join("")}</div>
    <div class="row"><button class="btn-ghost" data-act="backreview">← Değerlendirmeye Dön</button><button class="btn-ghost" data-act="again">Aynı Takımlarla Yeni Tur</button><button class="btn-ghost" data-act="endsession">Oturumu Kapat</button></div>`;
}
function confetti(){
  const c = $("confetti"); c.innerHTML = "";
  const cols = TEAMS.map(t => t.renk).concat(["#fff", "#ff7a1a"]);
  for(let i = 0; i < 140; i++){
    const e = document.createElement("i");
    e.style.left = Math.random() * 100 + "vw"; e.style.background = cols[i % cols.length];
    e.style.animationDuration = (2.5 + Math.random() * 2.5) + "s"; e.style.animationDelay = Math.random() * 1.2 + "s";
    c.appendChild(e);
  }
  setTimeout(() => c.innerHTML = "", 6500);
}

/* --- Ayarlar modalı --- */
function openSettings(){
  const m = document.createElement("div"); m.className = "modal"; m.id = "modal";
  m.innerHTML = `<div class="card"><h3>Ayarlar</h3>
    <div class="field"><label>Görsel</label>${imgBoxHtml()}</div>
    <div class="row"><div class="field" style="max-width:180px"><label>Yazma süresi (sn)</label><input id="sureSet" type="number" min="5" max="600" value="${S.o ? S.o.sure : S.sure}"></div></div>
    <div class="field"><label>Katılım linki</label><input readonly value="${esc(joinUrl())}" onclick="this.select()"></div>
    <div class="row"><button class="btn-main" data-act="closeset" style="font-size:16px;padding:12px 22px">Kaydet & Kapat</button><span style="flex:1"></span><button class="btn-danger" data-act="endsession">Oturumu Kapat</button></div></div>`;
  document.body.appendChild(m);
}

/* ---------- Olaylar ---------- */
document.addEventListener("change", e => {
  if(e.target.matches("[data-img]")){ loadImage(e.target.files[0]); const m = $("modal"); if(m) m.remove(); }
});
document.addEventListener("input", e => {
  if(e.target.id === "scoreInp" && S.sel) S.edited[S.sel] = e.target.value;
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ $("lightbox").hidden = true; }
  if(e.key === "Enter" && e.target.id === "scoreInp") saveScore();
});
$("lightbox").addEventListener("click", () => $("lightbox").hidden = true);

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  try{
    if(a === "savecfg"){ ls("eo_url", $("cfgUrl").value.trim()); ls("eo_key", $("cfgKey").value.trim()); if(initSb()){ render(); refresh(); } else toast("Bağlantı bilgisi eksik", true); }
    else if(a === "newsession"){
      const sure = Math.max(5, parseInt($("sureInp").value, 10) || 30); S.sure = sure; ls("eo_sure", String(sure));
      const kod = Array.from({ length: 5 }, () => "ABCDEFGHJKLMNPRSTUVYZ23456789"[Math.floor(Math.random() * 29)]).join("");
      b.disabled = true;
      await api.createSession(kod, sure);
      S.kod = kod; ls("eo_kod", kod); S.o = { kod, durum: "lobi", sure, puanlar: {} }; S.kat = []; S.marks = {}; S.edited = {};
      render();
    }
    else if(a === "imgdel"){ S.gorsel = null; ls("eo_gorsel", null); S.screen = null; const m = $("modal"); if(m) m.remove(); render(); }
    else if(a === "kick"){ if(confirm("Bu katılımcı lobiden çıkarılsın mı?")){ await api.delKat(b.dataset.id); S.kat = S.kat.filter(k => k.id !== b.dataset.id); render(); } }
    else if(a === "draw" || a === "redraw"){ if(a === "redraw" && !confirm("Kura yeniden çekilsin mi? Takımlar değişecek.")) return; doDraw(); }
    else if(a === "startwrite"){ b.disabled = true; await startWrite(); }
    else if(a === "plus10"){ const nb = new Date(Math.max(Date.now(), new Date(S.o.bitis).getTime()) + 10000).toISOString(); S.ending = false; await setSession({ bitis: nb }); }
    else if(a === "endnow"){ if(confirm("Süre şimdi bitirilsin mi?")) await setSession({ bitis: new Date().toISOString() }); }
    else if(a === "zoom"){ if(S.gorsel){ $("lightbox").querySelector("img").src = S.gorsel; $("lightbox").hidden = false; } }
    else if(a === "seltab"){ S.sel = b.dataset.t; updReview(); setSession({ aktif_takim: S.sel }); }
    else if(a === "mark"){ const k = b.dataset.k, v = b.dataset.v; S.marks[k] = S.marks[k] === v ? undefined : v; if(!S.marks[k]) delete S.marks[k]; saveMarks(); delete S.edited[S.sel]; renderRbox(); }
    else if(a === "allyes"){ teamItems(S.sel).forEach(x => { if(!S.marks[x.key]) S.marks[x.key] = "y"; }); saveMarks(); delete S.edited[S.sel]; renderRbox(); }
    else if(a === "savescore"){ await saveScore(); }
    else if(a === "showresult"){ await setSession({ durum: "sonuc", aktif_takim: null }); }
    else if(a === "backreview"){ await setSession({ durum: "degerlendirme" }); }
    else if(a === "again"){ if(confirm("Aynı takımlarla yeni tur başlasın mı? (Puanlar ve maddeler sıfırlanır, yeni görsel yükleyebilirsiniz)")){ S.marks = {}; S.edited = {}; saveMarks(); await setSession({ durum: "takimlar", puanlar: {}, aktif_takim: null, bitis: null }); } }
    else if(a === "settings"){ openSettings(); }
    else if(a === "closeset"){ const v = Math.max(5, parseInt($("sureSet").value, 10) || 30); S.sure = v; ls("eo_sure", String(v)); $("modal").remove(); if(S.o && S.o.sure !== v) await setSession({ sure: v }); }
    else if(a === "endsession"){
      if(!confirm("Oturum kapatılsın mı? Yeni bir QR ile yeni oturum başlatabilirsiniz.")) return;
      const m = $("modal"); if(m) m.remove();
      ls("eo_marks_" + S.kod, null); S.kod = null; ls("eo_kod", null); S.o = null; S.kat = []; S.drawing = null; render();
    }
  }catch(err){ showErr(err); }
});

/* ---------- Başlat ---------- */
function boot(){
  if(initSb()){
    try{
      sb.channel("eo_admin").on("postgres_changes", { event: "*", schema: "public", table: "egitim_katilimci" }, () => refresh()).subscribe();
    }catch(e){ console.warn(e); }
  }
  render(); refresh();
  setInterval(refresh, 2000);
}
boot();
</script>
</body>
</html>
